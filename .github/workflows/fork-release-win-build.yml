# mercurai fork: build the Windows installer for a `v<upstream>-mercurai.N` tag and publish it to the
# mercurai release channel (mercurai/orca-mercurai) as a normal release (so /releases/latest resolves). The tag is the one
# fork-assemble-release pushes; that job dispatches this one after it tags. The channel code itself
# (src/shared/release-channel.ts, config/electron-builder.config.cjs) rides in the `orca-release-channel`
# patch, so the checked-out tag already knows the `mercurai` channel. Lives in the fork only.
#
# Unsigned on purpose, like upstream's Windows dev channels: the build carries no publisherName and
# verifyUpdateCodeSignature is false, so the installed app updates itself from this channel without
# a SignPath step. The first install is by hand (see config/mercurai/README.md, Release channel).
#
#   gh workflow run fork-release-win-build.yml --ref mercurai -f tag=v1.4.222-mercurai.1
#
# Who holds what (config/mercurai/scripts/release-workflow-token-scope.test.mjs enforces it):
#   preflight       no secret; runs no repository code
#   orcad-template  no secret; builds the ref's code in a container
#   build-win       no secret; builds and packages the ref's code
#   publish         FORK_BOT_TOKEN, the only credential that can write to the channel repo; runs no
#                   repository code; exists only for a real build dispatched from the default branch
# The owner's installed app updates itself from the channel repo, so the code being built must
# never share a job with the token that publishes it. The publish job's condition reads only the
# dispatch inputs and the dispatching ref, which no step of another job can change.
#
# Packaging-only dry run: `-f dry_run=true` builds, packages and checks the installer and keeps it
# as a run artifact. No publish job exists in that run. The artifact carries the installer alone,
# renamed with a DRY-RUN marker and without latest.yml or the blockmap, so nothing in it can be
# served as an update. A dispatch from a branch other than the default branch is always a dry run.
#
#   gh workflow run fork-release-win-build.yml --ref mercurai -f tag=v1.4.223-mercurai.8 -f dry_run=true
#
# `-f ref=<branch>` builds that ref instead of the tag; the tag then only supplies the version. It
# is a dry run by definition, and it must be dispatched from a branch other than the default one:
# a run saves its build caches in the scope of the branch it was dispatched from, and the default
# branch's scope is where a release restores them. Code that is not a tag never writes there.
#
#   gh workflow run fork-release-win-build.yml --ref <a branch carrying these workflows> \
#     -f tag=v1.4.224-mercurai.0 -f ref=ci-only/v1.4.224/assembly-dry-run-2
name: fork-release-win-build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Mercurai release tag to build and publish (for example v1.4.222-mercurai.1)
        type: string
        required: true
      dry_run:
        description: Build, package and check only; publish nothing
        type: boolean
        default: false
      ref:
        description: Dry run only. Build this ref instead of the tag (the tag then only names the version)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Re-dispatching one tag must not race two uploads into one release; different tags are independent.
  # A dry run uploads to no release, so it never waits on, or blocks, a real build of the same tag.
  group: fork-release-win-build-${{ inputs.tag }}${{ (inputs.dry_run || github.ref != format('refs/heads/{0}', github.event.repository.default_branch || 'mercurai')) && '-dry-run' || '' }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag }}
  # Files a deployed orcad must list, when the ref ships the template (claude-code-config#1124).
  ORCAD_REQUIRED_FILES: git-spawn-worker-entry.js

jobs:
  # Seconds long, no checkout: refuse a malformed dispatch before forty minutes of building.
  preflight:
    if: github.repository == 'mercurai/orca'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.vet.outputs.version }}
      publish: ${{ steps.vet.outputs.publish }}
      build_ref: ${{ steps.vet.outputs.build_ref }}
    steps:
      - name: Vet the dispatch
        id: vet
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          REF_INPUT: ${{ inputs.ref }}
          DISPATCH_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'mercurai' }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-mercurai\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' is not v<major>.<minor>.<patch>-mercurai.<n>"
            exit 1
          fi
          publish=false
          if [ "$DRY_RUN" != "true" ] && [ "$DISPATCH_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            publish=true
          fi
          # A release is built from its tag and nothing else; another ref is for a dry run only.
          if [ "$publish" = "true" ] && [ -n "$REF_INPUT" ]; then
            echo "::error::ref '$REF_INPUT' can only be built as a dry run (dry_run=true); a published build comes from the tag."
            exit 1
          fi
          # A run dispatched from the default branch saves its build caches where the next release
          # restores them, so it may only build a tag. Another ref is built from a branch of its own.
          if [ -n "$REF_INPUT" ] && [ "$DISPATCH_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::ref '$REF_INPUT' cannot be built by a run dispatched from $DEFAULT_BRANCH: that run's caches are the ones a release restores. Dispatch from another branch that carries these workflows (gh workflow run ... --ref <that branch> -f ref=$REF_INPUT)."
            exit 1
          fi
          build_ref=${REF_INPUT:-refs/tags/$TAG}
          {
            echo "version=${TAG#v}"
            echo "publish=$publish"
            echo "build_ref=$build_ref"
          } >> "$GITHUB_OUTPUT"
          echo "building $build_ref as ${TAG#v}; publish=$publish (dispatched from $DISPATCH_REF, dry_run=$DRY_RUN)"

  # From v1.4.224 every SSH host runs orcad, deployed from a template inside the app. A ref without
  # patch/orca-partial-orcad-template reports ships=false and packages as before, which is the
  # whole v1.4.223 line (claude-code-config#1125).
  orcad-template:
    needs: preflight
    uses: ./.github/workflows/fork-orcad-template.yml
    with:
      ref: ${{ needs.preflight.outputs.build_ref }}
      # `env` is not available in `with`; keep this equal to ORCAD_REQUIRED_FILES above.
      require: git-spawn-worker-entry.js

  build-win:
    needs: [preflight, orcad-template]
    # windows-2022, not windows-latest: the 2025 image's VS 2026 breaks node-gyp, as in the dev channels.
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      # The default token reads this repository; this job is given no other credential.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.build_ref }}
          persist-credentials: false

      # A branch can move while the template builds: the app and its template must be one commit.
      - name: Check the template was built from this commit
        if: needs.orcad-template.outputs.ships == 'true'
        shell: bash
        env:
          TEMPLATE_SHA: ${{ needs.orcad-template.outputs.sha }}
        run: |
          set -euo pipefail
          head_sha=$(git rev-parse HEAD)
          if [ "$head_sha" != "$TEMPLATE_SHA" ]; then
            echo "::error::the orcad template was built from $TEMPLATE_SHA but this job checked out $head_sha; the ref moved during the run. Dispatch again."
            exit 1
          fi

      # The packaging config comes from the tag's tree, not from this workflow's branch. A tag cut before the
      # channel patch landed ignores ORCA_WIN_MERCURAI and would publish to upstream's repo name; say so now.
      - name: Resolve the packaging identity
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          echo "ORCA_WIN_MERCURAI=1" >> "$GITHUB_ENV"
          echo "ORCA_MERCURAI_BUILD_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "ORCA_BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          if ! grep -q "ORCA_WIN_MERCURAI" config/electron-builder.config.cjs; then
            echo "::error::$TAG has no mercurai channel in config/electron-builder.config.cjs; it was assembled without the orca-release-channel patch."
            exit 1
          fi

      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: electron
      - uses: ./.github/actions/install-mobile-dependencies

      - name: Verify the packaging identity
        shell: bash
        run: node config/scripts/verify-dev-channel-packaging.mjs --channel=mercurai --platform=win32

      # Same relay addons the upstream dev Windows leg builds before packaging.
      - name: Build Windows process-table addon for the relay
        shell: bash
        run: |
          node config/scripts/build-windows-process-tree-relay-addon.mjs --arch=x64
          node config/scripts/build-windows-process-tree-relay-addon.mjs --arch=arm64

      # build:release is what the upstream dev Windows leg runs: relay, native CLI launcher, CLI, app and mobile web bundle.
      - name: Build app
        shell: bash
        run: pnpm run build:release
        env:
          ORCA_REQUIRE_RELAY_NATIVE_ADDONS: 'x64,arm64'

      - name: Download the orcad deployment template
        if: needs.orcad-template.outputs.ships == 'true'
        uses: actions/download-artifact@v8
        with:
          name: orcad-template
          path: out/orcad-template

      # --publish never: this job only packages; the publish job uploads.
      - name: Build the Windows installer
        shell: bash
        env:
          SHIPS_ORCAD_TEMPLATE: ${{ needs.orcad-template.outputs.ships }}
          ORCAD_TEMPLATE_TARGETS: ${{ needs.orcad-template.outputs.targets }}
        run: |
          set -euo pipefail
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          # Exported here and only here: an empty list fails packaging by design, and upstream's own
          # packaging tests read these from the ambient environment. Both together: without the
          # REQUIRE flag a missing template would pass as "skipped".
          if [ "$SHIPS_ORCAD_TEMPLATE" = "true" ]; then
            export ORCA_REQUIRE_ORCAD_TEMPLATE=1
            export ORCA_ORCAD_TEMPLATE_TARGETS="$ORCAD_TEMPLATE_TARGETS"
          fi
          pnpm exec electron-builder --config config/electron-builder.config.cjs --win --publish never

      # The fork's check script lives on the workflow's branch, not in the release tag's tree.
      - name: Fetch the fork's template check
        if: needs.orcad-template.outputs.ships == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .fork
          sparse-checkout: config/mercurai/scripts
          persist-credentials: false

      # What ships is what gets checked: the template inside the unpacked app, not the build input.
      - name: Check the packaged orcad template
        if: needs.orcad-template.outputs.ships == 'true'
        shell: bash
        env:
          ORCAD_TEMPLATE_TARGETS: ${{ needs.orcad-template.outputs.targets }}
        run: |
          set -euo pipefail
          require_args=()
          # Split on spaces without expanding globs against the checkout.
          read -ra required_files <<<"$ORCAD_REQUIRED_FILES"
          for file in "${required_files[@]}"; do require_args+=(--require "$file"); done
          report=$(node .fork/config/mercurai/scripts/check-orcad-template.mjs \
            --repo "$GITHUB_WORKSPACE" --resources dist/win-unpacked/resources \
            --targets "$ORCAD_TEMPLATE_TARGETS" "${require_args[@]}")
          echo "$report"
          # Why: a script that exits 0 without checking must not read as a pass.
          grep -q '^orcad template ok: ' <<<"$report"

      - name: Check the build outputs
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          for f in orca-windows-setup.exe orca-windows-setup.exe.blockmap latest.yml; do
            [ -f "dist/$f" ] || { echo "::error::dist/$f was not produced; the Windows build cannot ship"; ls -la dist; exit 1; }
          done
          grep -q "^version: ${VERSION}\$" dist/latest.yml || { echo "::error::dist/latest.yml does not carry version ${VERSION}"; cat dist/latest.yml; exit 1; }

      # Keep the installer even when publishing fails (a token without the channel repo, a GitHub outage):
      # the run's artifact can be installed by hand, and re-running the publish job publishes without a rebuild.
      - name: Keep the release files as a run artifact
        if: needs.preflight.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: orca-windows-${{ inputs.tag }}
          path: |
            dist/orca-windows-setup.exe
            dist/orca-windows-setup.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14

      # A dry run must not leave anything that can be served as an update: no update manifest, no
      # blockmap, and an installer whose name says what it is.
      - name: Strip the update files from a dry run
        if: needs.preflight.outputs.publish != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir dry-run
          mv dist/orca-windows-setup.exe "dry-run/orca-windows-setup-DRY-RUN-${TAG}.exe"
          rm -f dist/latest.yml dist/orca-windows-setup.exe.blockmap
          ls -la dry-run

      - name: Keep the dry-run installer as a run artifact
        if: needs.preflight.outputs.publish != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: orca-windows-${{ inputs.tag }}-DRY-RUN
          path: dry-run/
          if-no-files-found: error
          retention-days: 14

  # The only job that receives the channel-repo token, and it runs no repository code: it downloads
  # the three release files the build job made and uploads them. Its condition reads the dispatch
  # inputs and the dispatching ref directly, never a value a build step could have written.
  publish:
    needs: [preflight, build-win]
    if: ${{ github.repository == 'mercurai/orca' && !inputs.dry_run && inputs.ref == '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch || 'mercurai') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The runner has no checkout here; name the repos outright.
      GH_REPO: ${{ github.repository }}
      CHANNEL_REPO: mercurai/orca-mercurai
      TAG: ${{ inputs.tag }}
    steps:
      - name: Require the bot token
        env:
          HAS_TOKEN: ${{ secrets.FORK_BOT_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::FORK_BOT_TOKEN is not set; see config/mercurai/README.md (one-time setup). The installer is kept as this run's artifact; set the token and re-run this job."
            exit 1
          fi

      # Vetted again here: this job must not trust another job's word for what it publishes.
      - name: Vet the tag
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-mercurai\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' is not v<major>.<minor>.<patch>-mercurai.<n>"
            exit 1
          fi

      - name: Download the release files
        uses: actions/download-artifact@v8
        with:
          name: orca-windows-${{ inputs.tag }}
          path: dist

      - name: Check the release files
        run: |
          set -euo pipefail
          for f in orca-windows-setup.exe orca-windows-setup.exe.blockmap latest.yml; do
            # A regular, non-empty file: not a link that points somewhere else on the runner.
            if [ ! -f "dist/$f" ] || [ -L "dist/$f" ] || [ ! -s "dist/$f" ]; then
              echo "::error::dist/$f is missing from the build artifact, empty, or not a regular file"
              ls -la dist
              exit 1
            fi
          done
          # Exactly the three files that get uploaded, and nothing else rides along.
          entries=$(find dist -mindepth 1 | wc -l)
          if [ "$entries" -ne 3 ]; then
            echo "::error::the build artifact holds $entries entries, not the three release files"
            find dist -mindepth 1
            exit 1
          fi
          grep -q "^version: ${TAG#v}\$" dist/latest.yml || { echo "::error::dist/latest.yml does not carry version ${TAG#v}"; cat dist/latest.yml; exit 1; }
          # The manifest is what the updater trusts: it must describe this very installer.
          actual=$(openssl dgst -sha512 -binary dist/orca-windows-setup.exe | base64 -w0)
          grep -qF "sha512: $actual" dist/latest.yml || { echo "::error::dist/latest.yml does not carry the sha512 of dist/orca-windows-setup.exe ($actual)"; cat dist/latest.yml; exit 1; }

      # A repo with no commit cannot hold a release tag, so give an empty channel repo its first commit once.
      - name: Make sure the channel repo has a commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FORK_BOT_TOKEN }}
        run: |
          set -euo pipefail
          deny() { echo "::error::The token cannot write to $CHANNEL_REPO. Add orca-mercurai to the FORK_BOT_TOKEN fine-grained token (Contents: read and write); see config/mercurai/README.md (Release channel)."; echo "$1"; exit 1; }
          if out=$(gh api "repos/$CHANNEL_REPO/commits?per_page=1" 2>&1); then
            echo "channel repo has history"
          elif grep -qi "empty" <<<"$out"; then
            content=$(printf '# orca-mercurai\n\nRelease assets for the mercurai Orca build channel, published by mercurai/orca CI only.\n' | base64 -w0)
            out=$(gh api -X PUT "repos/$CHANNEL_REPO/contents/README.md" -f message='chore: initial commit' -f content="$content" 2>&1) || deny "$out"
            echo "created the first commit"
          else
            deny "$out"
          fi

      # Draft first, public last: the updater reads latest.yml from a published release, so it must never see one
      # whose installer is still uploading.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FORK_BOT_TOKEN }}
        run: |
          set -euo pipefail
          deny() { echo "::error::Upload to $CHANNEL_REPO was denied. Add orca-mercurai to the FORK_BOT_TOKEN fine-grained token (Contents: read and write); see config/mercurai/README.md (Release channel)."; echo "$1"; exit 1; }
          files=(dist/orca-windows-setup.exe dist/orca-windows-setup.exe.blockmap dist/latest.yml)
          if gh release view "$TAG" --repo "$CHANNEL_REPO" >/dev/null 2>&1; then
            # Re-run on a published release: hide it while the assets are replaced, manifest last.
            out=$(gh release edit "$TAG" --repo "$CHANNEL_REPO" --draft=true 2>&1) || deny "$out"
            out=$(gh release upload "$TAG" "${files[@]:0:2}" --repo "$CHANNEL_REPO" --clobber 2>&1) || deny "$out"
            out=$(gh release upload "$TAG" "${files[2]}" --repo "$CHANNEL_REPO" --clobber 2>&1) || deny "$out"
          else
            out=$(gh release create "$TAG" "${files[@]}" --repo "$CHANNEL_REPO" --title "$TAG" --draft \
              --notes "Mercurai build of $TAG. Unsigned Windows installer, built by mercurai/orca CI run ${GITHUB_RUN_ID}." 2>&1) || deny "$out"
          fi
          out=$(gh release edit "$TAG" --repo "$CHANNEL_REPO" --draft=false --latest 2>&1) || deny "$out"

      - name: Verify the update manifest is public
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FORK_BOT_TOKEN }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --repo "$CHANNEL_REPO" --json assets --jq '.assets[].name')"
          echo "$assets"
          for required in latest.yml orca-windows-setup.exe orca-windows-setup.exe.blockmap; do
            grep -qx "$required" <<<"$assets" || { echo "::error::$TAG is missing $required in $CHANNEL_REPO"; exit 1; }
          done
