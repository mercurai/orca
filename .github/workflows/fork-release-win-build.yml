# mercurai fork: build the Windows installer for a `v<upstream>-mercurai.N` tag and publish it to the
# mercurai release channel (mercurai/orca-mercurai) as a normal release (so /releases/latest resolves). The tag is the one
# fork-assemble-release pushes; that job dispatches this one after it tags. The channel code itself
# (src/shared/release-channel.ts, config/electron-builder.config.cjs) rides in the `orca-release-channel`
# patch, so the checked-out tag already knows the `mercurai` channel. Lives in the fork only.
#
# Unsigned on purpose, like upstream's Windows dev channels: the build carries no publisherName and
# verifyUpdateCodeSignature is false, so the installed app updates itself from this channel without
# a SignPath step. The first install is by hand (see config/mercurai/README.md, Release channel).
#
#   gh workflow run fork-release-win-build.yml --ref mercurai -f tag=v1.4.222-mercurai.1
#
# Who holds what (config/mercurai/scripts/release-workflow-token-scope.test.mjs enforces it):
#   preflight       no secret; runs no repository code
#   orcad-template  no secret; builds the ref's code in a container
#   build-win       no secret; builds and packages the ref's code
#   publish         FORK_BOT_TOKEN, the only credential that can write to the channel repo; runs no
#                   repository code; exists only for a real build dispatched from the default branch
# The owner's installed app updates itself from the channel repo, so the code being built must
# never share a job with the token that publishes it. The publish job's condition reads only the
# dispatch inputs and the dispatching ref, which no step of another job can change.
#
# No job here restores or saves an Actions cache, dry run or not. Inherited upstream workflows
# and any job's runner token can write the default branch's cache scope, so a cached pnpm store,
# native build or Electron archive could carry code no commit shows. Every run installs from the
# registry and builds its native modules and Electron download from scratch. The repo's own
# install actions cache by default, so these jobs spell the install out instead of using them.
#
# Every job builds one commit: preflight resolves the tag (or ref) to a sha once, and each job
# checks out that sha, so a tag moved during the run cannot change what is built.
#
# Packaging-only dry run: `-f dry_run=true` builds, packages and checks the installer and keeps it
# as a run artifact. No publish job exists in that run. The artifact carries the installer alone,
# renamed with a DRY-RUN marker and without latest.yml or the blockmap, so nothing in it can be
# served as an update. A dispatch from a branch other than the default branch is always a dry run.
#
#   gh workflow run fork-release-win-build.yml --ref mercurai -f tag=v1.4.223-mercurai.8 -f dry_run=true
#
# `-f ref=<branch>` builds that branch instead of the tag; the tag then only supplies the version.
# It is a dry run by definition, and it must be dispatched from a branch other than the default
# one: code that is not a tag stays out of the default branch's cache scope. No job holding the
# bot token restores that scope any more (claude-code-config#1125, SEC-201); this keeps it clean
# should one ever do so again. Only a branch of this repo is accepted: no pull-request head, tag
# or bare sha from the fork network.
#
#   gh workflow run fork-release-win-build.yml --ref <a branch carrying these workflows> \
#     -f tag=v1.4.224-mercurai.0 -f ref=ci-only/v1.4.224/assembly-dry-run-2
name: fork-release-win-build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Mercurai release tag to build and publish (for example v1.4.222-mercurai.1)
        type: string
        required: true
      dry_run:
        description: Build, package and check only; publish nothing
        type: boolean
        default: false
      ref:
        description: Dry run only. Build this ref instead of the tag (the tag then only names the version)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Re-dispatching one tag must not race two uploads into one release; different tags are independent.
  # A dry run uploads to no release, so it never waits on, or blocks, a real build of the same tag.
  group: fork-release-win-build-${{ inputs.tag }}${{ (inputs.dry_run || github.ref != format('refs/heads/{0}', github.event.repository.default_branch || 'mercurai')) && '-dry-run' || '' }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag }}
  # Files a deployed orcad must list, when the ref ships the template (claude-code-config#1124).
  ORCAD_REQUIRED_FILES: git-spawn-worker-entry.js

jobs:
  # Seconds long, no checkout: refuse a malformed dispatch before forty minutes of building.
  preflight:
    if: github.repository == 'mercurai/orca'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.vet.outputs.version }}
      publish: ${{ steps.vet.outputs.publish }}
      build_ref: ${{ steps.vet.outputs.build_ref }}
      build_sha: ${{ steps.vet.outputs.build_sha }}
    steps:
      - name: Vet the dispatch
        id: vet
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          REF_INPUT: ${{ inputs.ref }}
          DISPATCH_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'mercurai' }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-mercurai\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' is not v<major>.<minor>.<patch>-mercurai.<n>"
            exit 1
          fi
          publish=false
          if [ "$DRY_RUN" != "true" ] && [ "$DISPATCH_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            publish=true
          fi
          # A release is built from its tag and nothing else; another ref is for a dry run only.
          if [ "$publish" = "true" ] && [ -n "$REF_INPUT" ]; then
            echo "::error::ref '$REF_INPUT' can only be built as a dry run (dry_run=true); a published build comes from the tag."
            exit 1
          fi
          # A run dispatched from the default branch runs in the cache scope that the workflows
          # holding the bot token restore, so it may only build a tag. A branch is built from a
          # branch of its own.
          if [ -n "$REF_INPUT" ] && [ "$DISPATCH_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::ref '$REF_INPUT' cannot be built by a run dispatched from $DEFAULT_BRANCH: that run's caches are the ones a release restores. Dispatch from another branch that carries these workflows (gh workflow run ... --ref <that branch> -f ref=$REF_INPUT)."
            exit 1
          fi
          # A dry-run ref is a branch of this repo: a pull-request head or a bare sha could name
          # code from anywhere in the fork network.
          if [ -n "$REF_INPUT" ]; then
            branch=${REF_INPUT#refs/heads/}
            if [[ ! "$branch" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]] || [[ "$branch" == refs/* ]]; then
              echo "::error::ref must be a branch of this repository (name or refs/heads/name)"
              exit 1
            fi
            want=refs/heads/$branch
          else
            want=refs/tags/$TAG
          fi
          build_ref=$want
          # One commit for every job: an annotated tag resolves through its peeled line, a branch
          # through its head.
          listed=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" "$want" "$want^{}")
          build_sha=$(awk -v peeled="$want^{}" '$2 == peeled { print $1 }' <<<"$listed")
          build_sha=${build_sha:-$(awk -v ref="$want" '$2 == ref { print $1 }' <<<"$listed")}
          if [[ ! "$build_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::$build_ref does not resolve to a commit in $GITHUB_REPOSITORY"
            exit 1
          fi
          {
            echo "version=${TAG#v}"
            echo "publish=$publish"
            echo "build_ref=$build_ref"
            echo "build_sha=$build_sha"
          } >> "$GITHUB_OUTPUT"
          echo "building $build_ref ($build_sha) as ${TAG#v}; publish=$publish (dispatched from $DISPATCH_REF, dry_run=$DRY_RUN)"

  # From v1.4.224 every SSH host runs orcad, deployed from a template inside the app. A ref without
  # patch/orca-partial-orcad-template reports ships=false and packages as before, which is the
  # whole v1.4.223 line (claude-code-config#1125).
  orcad-template:
    needs: preflight
    uses: ./.github/workflows/fork-orcad-template.yml
    with:
      ref: ${{ needs.preflight.outputs.build_sha }}
      # `env` is not available in `with`; keep this equal to ORCAD_REQUIRED_FILES above.
      require: git-spawn-worker-entry.js

  build-win:
    needs: [preflight, orcad-template]
    # windows-2022, not windows-latest: the 2025 image's VS 2026 breaks node-gyp, as in the dev channels.
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      # The default token reads this repository; this job is given no other credential.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.preflight.outputs.build_sha }}
          persist-credentials: false

      # The app and its template must be the commit preflight resolved.
      - name: Check this job and the template build one commit
        shell: bash
        env:
          BUILD_SHA: ${{ needs.preflight.outputs.build_sha }}
          SHIPS_ORCAD_TEMPLATE: ${{ needs.orcad-template.outputs.ships }}
          TEMPLATE_SHA: ${{ needs.orcad-template.outputs.sha }}
        run: |
          set -euo pipefail
          head_sha=$(git rev-parse HEAD)
          if [ "$head_sha" != "$BUILD_SHA" ]; then
            echo "::error::checked out $head_sha, not $BUILD_SHA"
            exit 1
          fi
          if [ "$SHIPS_ORCAD_TEMPLATE" = "true" ] && [ "$TEMPLATE_SHA" != "$BUILD_SHA" ]; then
            echo "::error::the orcad template was built from $TEMPLATE_SHA, not $BUILD_SHA"
            exit 1
          fi

      # Match upstream: this build no longer compiles the obsolete SSH relay addons.
      - name: Refuse a ref that still ships the SSH relay
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e config/tsconfig.relay.json ]]; then
            echo "::error::This ref predates #27215 and still ships the SSH relay; build a commit at or after 2b4b60a87e."
            exit 1
          fi

      # Nothing cached reaches the build: the Electron download and electron-builder's tools go to
      # empty directories of this run, and no native build output exists before the install.
      - name: Start from empty build caches
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${LOCALAPPDATA:?}/electron/Cache" "${LOCALAPPDATA:?}/electron-builder/Cache"
          mkdir -p "$RUNNER_TEMP/electron-cache" "$RUNNER_TEMP/electron-builder-cache"
          echo "ELECTRON_CACHE=$RUNNER_TEMP/electron-cache" >> "$GITHUB_ENV"
          echo "ELECTRON_BUILDER_CACHE=$RUNNER_TEMP/electron-builder-cache" >> "$GITHUB_ENV"
          rm -rf node_modules mobile/node_modules native/windows-registry/build

      # The packaging config comes from the tag's tree, not from this workflow's branch. A tag cut before the
      # channel patch landed ignores ORCA_WIN_MERCURAI and would publish to upstream's repo name; say so now.
      - name: Resolve the packaging identity
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          echo "ORCA_WIN_MERCURAI=1" >> "$GITHUB_ENV"
          echo "ORCA_MERCURAI_BUILD_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "ORCA_BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          if ! grep -q "ORCA_WIN_MERCURAI" config/electron-builder.config.cjs; then
            echo "::error::$TAG has no mercurai channel in config/electron-builder.config.cjs; it was assembled without the orca-release-channel patch."
            exit 1
          fi

      # The steps of the repo's install-node-dependencies and install-mobile-dependencies,
      # without their caches (see the header).
      - name: Setup pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          install: false
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          git diff --exit-code -- package.json pnpm-lock.yaml pnpm-workspace.yaml
          if [ -d node_modules/bun ]; then
            pnpm rebuild bun
          fi
          pnpm run --if-present build:packages
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          cd mobile
          pnpm install --frozen-lockfile
          git diff --exit-code -- package.json pnpm-lock.yaml pnpm-workspace.yaml

      - name: Verify the packaging identity
        shell: bash
        run: node config/scripts/verify-dev-channel-packaging.mjs --channel=mercurai --platform=win32

      # Current upstream Windows builds prepare desktop addons through ensure-native-runtime;
      # build:release builds the native CLI launcher and hook, CLI, app and mobile web bundle.
      - name: Build app
        shell: bash
        run: pnpm run build:release

      - name: Download the orcad deployment template
        if: needs.orcad-template.outputs.ships == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: orcad-template
          path: out/orcad-template

      # --publish never: this job only packages; the publish job uploads.
      - name: Build the Windows installer
        shell: bash
        env:
          SHIPS_ORCAD_TEMPLATE: ${{ needs.orcad-template.outputs.ships }}
          ORCAD_TEMPLATE_TARGETS: ${{ needs.orcad-template.outputs.targets }}
        run: |
          set -euo pipefail
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          # Exported here and only here: an empty list fails packaging by design, and upstream's own
          # packaging tests read these from the ambient environment. Both together: without the
          # REQUIRE flag a missing template would pass as "skipped".
          if [ "$SHIPS_ORCAD_TEMPLATE" = "true" ]; then
            export ORCA_REQUIRE_ORCAD_TEMPLATE=1
            export ORCA_ORCAD_TEMPLATE_TARGETS="$ORCAD_TEMPLATE_TARGETS"
          fi
          pnpm exec electron-builder --config config/electron-builder.config.cjs --win --publish never

      # The fork's check script lives on the workflow's branch, not in the release tag's tree.
      - name: Fetch the fork's template check
        if: needs.orcad-template.outputs.ships == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: .fork
          sparse-checkout: config/mercurai/scripts
          persist-credentials: false

      # What ships is what gets checked: the template inside the unpacked app, not the build input.
      - name: Check the packaged orcad template
        if: needs.orcad-template.outputs.ships == 'true'
        shell: bash
        env:
          ORCAD_TEMPLATE_TARGETS: ${{ needs.orcad-template.outputs.targets }}
        run: |
          set -euo pipefail
          require_args=()
          # Split on spaces without expanding globs against the checkout.
          read -ra required_files <<<"$ORCAD_REQUIRED_FILES"
          for file in "${required_files[@]}"; do require_args+=(--require "$file"); done
          report=$(node .fork/config/mercurai/scripts/check-orcad-template.mjs \
            --repo "$GITHUB_WORKSPACE" --resources dist/win-unpacked/resources \
            --targets "$ORCAD_TEMPLATE_TARGETS" "${require_args[@]}")
          echo "$report"
          # Why: a script that exits 0 without checking must not read as a pass.
          grep -q '^orcad template ok: ' <<<"$report"

      - name: Check the build outputs
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          for f in orca-windows-setup.exe orca-windows-setup.exe.blockmap latest.yml; do
            [ -f "dist/$f" ] || { echo "::error::dist/$f was not produced; the Windows build cannot ship"; ls -la dist; exit 1; }
          done
          grep -q "^version: ${VERSION}\$" dist/latest.yml || { echo "::error::dist/latest.yml does not carry version ${VERSION}"; cat dist/latest.yml; exit 1; }

      # Every build, dry or real: the publish job repeats this, and a dry run proves it before the
      # strip. The manifest is what the updater trusts, so it must describe this very installer.
      - name: Check the update manifest field by field
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        # Windows runners have no yq: the manifest electron-builder writes has a fixed layout, so it is
        # checked line by line against the installer itself, which also pins its size and allows no
        # extra key. The publish job re-checks the version, path and hashes with yq (not the size).
        run: |
          set -euo pipefail
          actual=$(openssl dgst -sha512 -binary dist/orca-windows-setup.exe | base64 -w0)
          size=$(stat -c %s dist/orca-windows-setup.exe)
          expected=(
            "version: $VERSION"
            "files:"
            "  - url: orca-windows-setup.exe"
            "    sha512: $actual"
            "    size: $size"
            "path: orca-windows-setup.exe"
            "sha512: $actual"
          )
          mapfile -t found < <(sed 's/\r$//' dist/latest.yml)
          ok=true
          # CRLF ends only: YAML reads a lone CR as a line break, and bash drops NULs unseen.
          sed 's/\r$//' dist/latest.yml | LC_ALL=C grep -q $'\r' && ok=false
          tr -d '\000' < dist/latest.yml | cmp -s - dist/latest.yml || ok=false
          [ "${#found[@]}" -eq 8 ] || ok=false
          for i in "${!expected[@]}"; do [ "${found[$i]-}" = "${expected[$i]}" ] || ok=false; done
          [[ "${found[7]-}" =~ ^releaseDate:\ \'[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z\'$ ]] || ok=false
          if [ "$ok" != true ]; then
            echo "::error::dist/latest.yml does not describe dist/orca-windows-setup.exe exactly"
            printf 'expected:\n'; printf '  %s\n' "${expected[@]}" "releaseDate: '<ISO time>'"
            printf 'found:\n'; cat dist/latest.yml
            exit 1
          fi
          echo "update manifest ok: $VERSION, size $size, sha512 $actual"

      # Every build, dry or real: an installer whose app does not start must never reach the
      # channel. Installs silently into this run's temp dir with an isolated profile and home, the
      # way the upstream packaged E2E does, and stops only the processes it started, by PID.
      # A hung but live main process passes: this proves start-up, not responsiveness.
      - name: Smoke the installer (install, launch for 30 s, uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'orca-smoke'
          $installDir = Join-Path $root 'app'
          $userData = Join-Path $root 'user-data'
          $homeDir = Join-Path $root 'home'
          New-Item -ItemType Directory -Force $userData, $homeDir | Out-Null
          $setup = Start-Process -FilePath 'dist\orca-windows-setup.exe' -ArgumentList '/S', "/D=$installDir" -PassThru
          # Holding the handle keeps ExitCode readable once the process has gone.
          $null = $setup.Handle
          if (-not $setup.WaitForExit(300000)) { throw 'the installer did not finish within 5 min' }
          if ($setup.ExitCode -ne 0) { throw "the installer exited $($setup.ExitCode)" }
          $exe = Join-Path $installDir 'Orca.exe'
          if (-not (Test-Path $exe)) { throw "the installer left no Orca.exe in $installDir" }
          # Every Orca.exe running from under one dir, and nothing else.
          function Get-OrcaUnder([string]$dir) {
            @(Get-CimInstance Win32_Process -Filter "Name='Orca.exe'" |
              Where-Object { $_.ExecutablePath -and $_.ExecutablePath.StartsWith($dir, [StringComparison]::OrdinalIgnoreCase) })
          }
          $env:ORCA_E2E_USER_DATA_DIR = $userData
          $env:ORCA_E2E_HOME_DIR = $homeDir
          $env:HOME = $homeDir
          $env:USERPROFILE = $homeDir
          # The daemon relocates its Orca.exe under LOCALAPPDATA: keep that copy inside $root too.
          $env:LOCALAPPDATA = Join-Path $root 'local-app-data'
          $env:APPDATA = Join-Path $root 'app-data'
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA, $env:APPDATA | Out-Null
          $env:ORCA_BACKGROUND_LAUNCH = '1'
          $started = Get-Date
          $launched = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 30
            $running = Get-OrcaUnder $installDir
            # The app's main process: no Electron --type= helper and no node-mode child (daemon, workers).
            $main = @($running | Where-Object { $_.CommandLine -notmatch '--type=' -and $_.CommandLine -notmatch '\.[cm]?js\b' })
            $watched = @($running.ProcessId) + @($launched.Id)
            $werFaults = @(Get-CimInstance Win32_Process -Filter "Name='WerFault.exe'" |
              Where-Object { $cmd = $_.CommandLine; @($watched | Where-Object { $cmd -match "-p $_\b" }).Count -gt 0 })
            $dumps = @(Get-ChildItem $userData -Recurse -File -Filter *.dmp -ErrorAction SilentlyContinue)
            $appCrashes = @(Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Id = 1000; StartTime = $started } -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'Orca\.exe' })
            # A main process that threw at start-up stays alive behind Electron's error dialog, with no window.
            $renderers = @($running | Where-Object { $_.CommandLine -match '--type=renderer' })
            foreach ($process in $running) {
              $kind = if ($process.CommandLine -match '--type=(\S+)') { $Matches[1] } else { 'main or node child' }
              Write-Host "process $($process.ProcessId): $kind"
            }
            # The app's own text logs only; the rest of the profile is binary LevelDB.
            Get-ChildItem (Join-Path $userData 'logs') -Recurse -File -Include *.log, *.ndjson -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "== $($_.FullName)"
              Get-Content $_.FullName -Tail 40 -ErrorAction SilentlyContinue
            }
            if ($main.Count -eq 0) {
              $code = if ($launched.HasExited) { $launched.ExitCode } else { 'still running' }
              throw "Orca's main process was not running 30 s after launch (launcher: $code; install-dir processes: $($running.Count))"
            }
            if ($renderers.Count -eq 0) { throw "Orca's main process is alive but opened no renderer within 30 s: it failed before its window" }
            if ($werFaults.Count -gt 0) { throw "Windows Error Reporting opened for Orca: $($werFaults.CommandLine -join '; ')" }
            if ($dumps.Count -gt 0) { throw "Orca wrote crash dumps: $($dumps.FullName -join '; ')" }
            if ($appCrashes.Count -gt 0) { throw "Orca.exe crashed (Application event 1000): $($appCrashes[0].Message)" }
            Write-Host "smoke ok: Orca main process alive at 30 s (pid $($main.ProcessId -join ', '))"
          } finally {
            # Only the PIDs this step started (install dir and relocated daemon, all under $root); a tree
            # kill makes the later ones already gone, which is fine.
            foreach ($process in (Get-OrcaUnder $root)) { taskkill /PID $process.ProcessId /T /F 2>&1 | Out-Null }
            $global:LASTEXITCODE = 0
            $deadline = (Get-Date).AddSeconds(30)
            do { Start-Sleep -Seconds 1; $survivors = Get-OrcaUnder $root } while ($survivors.Count -gt 0 -and (Get-Date) -lt $deadline)
            if ($survivors.Count -gt 0) { throw "Orca processes survived the stop: $($survivors.ProcessId -join ', ')" }
            $uninstaller = Get-ChildItem $installDir -Filter 'Uninstall*.exe' | Select-Object -First 1
            if (-not $uninstaller) { throw "no uninstaller in $installDir" }
            Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait | Out-Null
            # The NSIS uninstaller re-runs itself from %TEMP%: wait for the app to be gone.
            $deadline = (Get-Date).AddSeconds(120)
            while ((Test-Path $exe) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
            if (Test-Path $exe) { throw "the uninstaller left $exe in place" }
          }
          Write-Host 'smoke: stopped and uninstalled'
          exit 0

      # Keep the installer even when publishing fails (a token without the channel repo, a GitHub outage):
      # the run's artifact can be installed by hand, and re-running the publish job publishes without a rebuild.
      - name: Keep the release files as a run artifact
        if: needs.preflight.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orca-windows-${{ inputs.tag }}
          path: |
            dist/orca-windows-setup.exe
            dist/orca-windows-setup.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14

      # A dry run must not leave anything that can be served as an update: no update manifest, no
      # blockmap, and an installer whose name says what it is.
      - name: Strip the update files from a dry run
        if: needs.preflight.outputs.publish != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir dry-run
          mv dist/orca-windows-setup.exe "dry-run/orca-windows-setup-DRY-RUN-${TAG}.exe"
          rm -f dist/latest.yml dist/orca-windows-setup.exe.blockmap
          ls -la dry-run

      - name: Keep the dry-run installer as a run artifact
        if: needs.preflight.outputs.publish != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orca-windows-${{ inputs.tag }}-DRY-RUN
          path: dry-run/
          if-no-files-found: error
          retention-days: 14

  # The only job that receives the channel-repo token, and it runs no repository code: it downloads
  # the three release files the build job made and uploads them. Its condition reads the dispatch
  # inputs and the dispatching ref directly, never a value a build step could have written.
  publish:
    needs: [preflight, build-win]
    if: ${{ github.repository == 'mercurai/orca' && !inputs.dry_run && inputs.ref == '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch || 'mercurai') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The runner has no checkout here; name the repos outright.
      GH_REPO: ${{ github.repository }}
      CHANNEL_REPO: mercurai/orca-mercurai
      TAG: ${{ inputs.tag }}
    steps:
      - name: Require the bot token
        env:
          HAS_TOKEN: ${{ secrets.FORK_BOT_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::FORK_BOT_TOKEN is not set; see config/mercurai/README.md (one-time setup). The installer is kept as this run's artifact; set the token and re-run this job."
            exit 1
          fi

      # Vetted again here: this job must not trust another job's word for what it publishes.
      - name: Vet the tag
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-mercurai\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' is not v<major>.<minor>.<patch>-mercurai.<n>"
            exit 1
          fi

      # Pinned by commit: an action in the job that holds the token must not change under it.
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: orca-windows-${{ inputs.tag }}
          path: dist

      - name: Check the release files
        run: |
          set -euo pipefail
          for f in orca-windows-setup.exe orca-windows-setup.exe.blockmap latest.yml; do
            # A regular, non-empty file: not a link that points somewhere else on the runner.
            if [ ! -f "dist/$f" ] || [ -L "dist/$f" ] || [ ! -s "dist/$f" ]; then
              echo "::error::dist/$f is missing from the build artifact, empty, or not a regular file"
              ls -la dist
              exit 1
            fi
          done
          # Exactly the three files that get uploaded, and nothing else rides along.
          entries=$(find dist -mindepth 1 | wc -l)
          if [ "$entries" -ne 3 ]; then
            echo "::error::the build artifact holds $entries entries, not the three release files"
            find dist -mindepth 1
            exit 1
          fi
          grep -q "^version: ${TAG#v}\$" dist/latest.yml || { echo "::error::dist/latest.yml does not carry version ${TAG#v}"; cat dist/latest.yml; exit 1; }
          # The manifest is what the updater trusts: field by field, it must describe this very
          # installer and point at it, under the channel's own base URL (a url with a host would not).
          actual=$(openssl dgst -sha512 -binary dist/orca-windows-setup.exe | base64 -w0)
          described=$(yq -r '[(.files | length), .files[0].url, .path, .files[0].sha512, .sha512, .version] | join(" ")' dist/latest.yml)
          expected="1 orca-windows-setup.exe orca-windows-setup.exe $actual $actual ${TAG#v}"
          if [ "$described" != "$expected" ]; then
            echo "::error::dist/latest.yml does not describe dist/orca-windows-setup.exe exactly"
            echo "expected: $expected"
            echo "found:    $described"
            cat dist/latest.yml
            exit 1
          fi

      # A repo with no commit cannot hold a release tag, so give an empty channel repo its first commit once.
      - name: Make sure the channel repo has a commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FORK_BOT_TOKEN }}
        run: |
          set -euo pipefail
          deny() { echo "::error::The token cannot write to $CHANNEL_REPO. Add orca-mercurai to the FORK_BOT_TOKEN fine-grained token (Contents: read and write); see config/mercurai/README.md (Release channel)."; echo "$1"; exit 1; }
          if out=$(gh api "repos/$CHANNEL_REPO/commits?per_page=1" 2>&1); then
            echo "channel repo has history"
          elif grep -qi "empty" <<<"$out"; then
            content=$(printf '# orca-mercurai\n\nRelease assets for the mercurai Orca build channel, published by mercurai/orca CI only.\n' | base64 -w0)
            out=$(gh api -X PUT "repos/$CHANNEL_REPO/contents/README.md" -f message='chore: initial commit' -f content="$content" 2>&1) || deny "$out"
            echo "created the first commit"
          else
            deny "$out"
          fi

      # Draft first, public last: the updater reads latest.yml from a published release, so it must never see one
      # whose installer is still uploading.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FORK_BOT_TOKEN }}
          BUILD_SHA: ${{ needs.preflight.outputs.build_sha }}
        run: |
          set -euo pipefail
          deny() { echo "::error::Upload to $CHANNEL_REPO was denied. Add orca-mercurai to the FORK_BOT_TOKEN fine-grained token (Contents: read and write); see config/mercurai/README.md (Release channel)."; echo "$1"; exit 1; }
          files=(dist/orca-windows-setup.exe dist/orca-windows-setup.exe.blockmap dist/latest.yml)
          if gh release view "$TAG" --repo "$CHANNEL_REPO" >/dev/null 2>&1; then
            # Re-run on a published release: hide it while the assets are replaced, manifest last.
            out=$(gh release edit "$TAG" --repo "$CHANNEL_REPO" --draft=true 2>&1) || deny "$out"
            out=$(gh release upload "$TAG" "${files[@]:0:2}" --repo "$CHANNEL_REPO" --clobber 2>&1) || deny "$out"
            out=$(gh release upload "$TAG" "${files[2]}" --repo "$CHANNEL_REPO" --clobber 2>&1) || deny "$out"
          else
            out=$(gh release create "$TAG" "${files[@]}" --repo "$CHANNEL_REPO" --title "$TAG" --draft \
              --notes "Mercurai build of $TAG. Unsigned Windows installer of commit ${BUILD_SHA}, built by mercurai/orca CI run ${GITHUB_RUN_ID}." 2>&1) || deny "$out"
          fi
          out=$(gh release edit "$TAG" --repo "$CHANNEL_REPO" --draft=false --latest 2>&1) || deny "$out"

      - name: Verify the update manifest is public
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FORK_BOT_TOKEN }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --repo "$CHANNEL_REPO" --json assets --jq '.assets[].name')"
          echo "$assets"
          for required in latest.yml orca-windows-setup.exe orca-windows-setup.exe.blockmap; do
            grep -qx "$required" <<<"$assets" || { echo "::error::$TAG is missing $required in $CHANNEL_REPO"; exit 1; }
          done
