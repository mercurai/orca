name: Git command termination runtime
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'src/main/git/command-runner/spawned-command-tree-kill*'
      - 'src/main/git/command-runner/exec-file-capture-worker-stderr.test.ts'
      - 'src/main/codex/codex-structured-session-options.test.ts'
      - '.github/workflows/git-command-termination-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: git-command-termination-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  windows-exit:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
      - name: Verify process termination and worker stderr progress
        run: node node_modules/vitest/vitest.mjs run --config config/vitest.config.ts --maxWorkers=2 src/main/git/command-runner/spawned-command-tree-kill.test.ts src/main/git/command-runner/exec-file-capture-worker-stderr.test.ts src/main/git/command-runner/git-spawn-worker-client.test.ts src/main/codex/codex-structured-session-options.test.ts
