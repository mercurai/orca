# mercurai fork: assemble a release branch = one upstream release tag + the active patch series,
# run the patches' tests, and tag it `v<upstream>-mercurai.N`. The branch and tag are what the
# build/publish job (fork-release-win-build, which this workflow dispatches after tagging) consumes. The series must
# already be rebased onto the tag (fork-rebase-patches does that and records it per patch).
# With upstream_main_sha the branch is a frozen commit of official stablyai/orca main instead: the
# tag is then the version floor and the name, and the manifest pins every active patch by commit.
# Dispatched from a non-default branch, or with dry_run, it pushes nothing. Lives in the fork only.
#
# FORK_BOT_TOKEN can push this repo's workflows and publish to the channel the owner's app updates
# from, so it never shares a job with the code under test (claude-code-config#1125, SEC-201). The
# test job assembles and tests with no secret and no cache. The push job runs no repository code:
# it assembles the branch again with git alone, pushes only if its tree and its base and patch
# commits are the ones tested, and hands the token to its push and dispatch steps only. Both jobs
# check out the dispatched commit, so a branch that moves mid-run cannot give them different inputs.
name: fork-assemble-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream release tag to assemble on (for example v1.4.222); with upstream_main_sha, the version floor and release name
        type: string
        required: true
      upstream_main_sha:
        description: Frozen stablyai/orca main commit to assemble on, lowercase 40-hex (empty assembles on the tag)
        type: string
        required: false
        default: ''
      dry_run:
        description: Assemble and test, but push nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fork-assemble-release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: stablyai/orca
  # The branch this run was started from: `mercurai` normally, a feature branch when dispatched for a test.
  FORK_BRANCH: ${{ github.ref_name }}
  MANIFEST: config/mercurai/patches.yaml
  MANIFEST_WORK: /tmp/manifest.yaml
  # The runner checkout has an upstream remote; gh prefers it when inferring the repo.
  GH_REPO: ${{ github.repository }}
  TAG: ${{ inputs.tag }}
  # Empty assembles on the tag. The script refuses anything but a full sha that official main holds.
  UPSTREAM_MAIN_SHA: ${{ inputs.upstream_main_sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      release_branch: ${{ steps.assemble.outputs.release_branch }}
      release_tag: ${{ steps.assemble.outputs.release_tag }}
      tree: ${{ steps.assemble.outputs.tree }}
      upstream_main_sha: ${{ steps.assemble.outputs.upstream_main_sha }}
      series: ${{ steps.assemble.outputs.series }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assemble the release branch
        id: assemble
        run: |
          set -euo pipefail
          # Copied out first: the checkout moves to the tag, which has no config/mercurai/.
          cp config/mercurai/scripts/assemble-release.sh /tmp/assemble-release.sh
          bash /tmp/assemble-release.sh

      - name: Tests named by the series
        id: tests
        run: |
          set -euo pipefail
          mapfile -t tests < <(yq -r '.patches[] | select(.status == "upstream-open" or .status == "ours-only") | .tests[]?' "$MANIFEST_WORK" | sort -u)
          echo "count=${#tests[@]}" >> "$GITHUB_OUTPUT"
          [ "${#tests[@]}" -eq 0 ] && echo "no patch names tests; nothing to run" || printf '%s\n' "${tests[@]}"
      # The steps of the repo's install-node-dependencies, without its caches: a default-branch
      # cache could carry code no commit shows (claude-code-config#1125, SEC-102/SEC-201).
      - name: Setup pnpm
        if: ${{ steps.tests.outputs.count != '0' }}
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          install: false
      - name: Setup Node.js
        if: ${{ steps.tests.outputs.count != '0' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Install dependencies
        if: ${{ steps.tests.outputs.count != '0' }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          git diff --exit-code -- package.json pnpm-lock.yaml pnpm-workspace.yaml
          pnpm run --if-present build:packages
      - name: Run the series tests
        if: ${{ steps.tests.outputs.count != '0' }}
        run: |
          set -euo pipefail
          mapfile -t tests < <(yq -r '.patches[] | select(.status == "upstream-open" or .status == "ours-only") | .tests[]?' "$MANIFEST_WORK" | sort -u)
          pnpm exec vitest run --config config/vitest.config.ts --maxWorkers 2 "${tests[@]}"

      - name: Report the dry run
        if: ${{ !(github.ref == format('refs/heads/{0}', github.event.repository.default_branch || 'mercurai') && !inputs.dry_run) }}
        run: echo "would tag ${{ steps.assemble.outputs.release_tag }} on ${{ steps.assemble.outputs.release_branch }}; nothing pushed"

  push:
    needs: test
    # Read from the dispatch alone: nothing the test job ran can open it.
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch || 'mercurai') && !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the bot token
        env:
          HAS_TOKEN: ${{ secrets.FORK_BOT_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::FORK_BOT_TOKEN is not set; see config/mercurai/README.md (one-time setup)"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Assembled again here, from git alone: the test job ran the code under test, so its result
      # is compared, never pushed. The same dispatched commit gives it the same manifest and inputs.
      - name: Assemble the release branch again
        id: assemble
        env:
          TESTED_BRANCH: ${{ needs.test.outputs.release_branch }}
          TESTED_TAG: ${{ needs.test.outputs.release_tag }}
          TESTED_TREE: ${{ needs.test.outputs.tree }}
        run: |
          set -euo pipefail
          cp config/mercurai/scripts/assemble-release.sh /tmp/assemble-release.sh
          bash /tmp/assemble-release.sh
          tree=$(git rev-parse 'HEAD^{tree}')
          branch=$(yq -r '.release_branch' "$MANIFEST_WORK")
          if [ "$tree" != "$TESTED_TREE" ] || [ "$branch" != "$TESTED_BRANCH" ]; then
            echo "::error::assembled $branch at tree $tree, but the tests ran on $TESTED_BRANCH at $TESTED_TREE; a patch branch moved during the run. Dispatch again."
            exit 1
          fi
          echo "tested tree $tree; release tag $TESTED_TAG"

      # The tree alone could match with other commits underneath: the base and the patch commits
      # this job assembled must be the ones the tests ran on.
      - name: Match the tested base and patch commits
        env:
          TESTED_MAIN_SHA: ${{ needs.test.outputs.upstream_main_sha }}
          TESTED_SERIES: ${{ needs.test.outputs.series }}
          ASSEMBLED_MAIN_SHA: ${{ steps.assemble.outputs.upstream_main_sha }}
          ASSEMBLED_SERIES: ${{ steps.assemble.outputs.series }}
        run: |
          set -euo pipefail
          if [ "$ASSEMBLED_MAIN_SHA" != "$TESTED_MAIN_SHA" ] || [ "$ASSEMBLED_SERIES" != "$TESTED_SERIES" ]; then
            echo "::error::assembled base ${ASSEMBLED_MAIN_SHA:-none} with patches ${ASSEMBLED_SERIES:-none}, but the tests ran on ${TESTED_MAIN_SHA:-none} with ${TESTED_SERIES:-none}. Dispatch again."
            exit 1
          fi

      - name: Push the release branch and tag
        env:
          GH_TOKEN: ${{ secrets.FORK_BOT_TOKEN }}
          RELEASE_BRANCH: ${{ steps.assemble.outputs.release_branch }}
          RELEASE_TAG: ${{ steps.assemble.outputs.release_tag }}
          MAIN_SHA: ${{ steps.assemble.outputs.upstream_main_sha }}
          SERIES: ${{ steps.assemble.outputs.series }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          # The release branch is assembled, never hand-edited, so replacing it is the contract.
          git push --force-with-lease origin "HEAD:refs/heads/$RELEASE_BRANCH"
          git tag -a "$RELEASE_TAG" -m "mercurai release on $TAG${MAIN_SHA:+ at upstream main $MAIN_SHA}: $(tr '\n' ' ' < /tmp/active)${SERIES:+pinned $SERIES}"
          git push origin "refs/tags/$RELEASE_TAG"
          echo "tagged $RELEASE_TAG on $RELEASE_BRANCH"

      - name: Hand the new tag to fork-release-win-build
        env:
          GH_TOKEN: ${{ secrets.FORK_BOT_TOKEN }}
          RELEASE_TAG: ${{ steps.assemble.outputs.release_tag }}
        run: |
          gh workflow run fork-release-win-build.yml --ref "$FORK_BRANCH" -f "tag=$RELEASE_TAG" || {
            echo "::error::$RELEASE_TAG is tagged but the build was not dispatched; run: gh workflow run fork-release-win-build.yml -R mercurai/orca --ref $FORK_BRANCH -f tag=$RELEASE_TAG (the token needs Actions write)"
            exit 1
          }
