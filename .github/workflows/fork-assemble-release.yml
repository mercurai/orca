# mercurai fork: assemble a release branch = one upstream release tag + the active patch series,
# run the patches' tests, and tag it `v<upstream>-mercurai.N`. The branch and tag are what the
# build/publish job (fork-release-win-build, which this workflow dispatches after tagging) consumes. The series must
# already be rebased onto the tag (fork-rebase-patches does that and records it per patch).
# With upstream_main_sha the branch is a frozen commit of official stablyai/orca main instead: the
# tag is then the version floor and the name, and the manifest pins every active patch by commit.
# Dispatched from a non-default branch, or with dry_run, it pushes nothing. Lives in the fork only.
#
# FORK_BOT_TOKEN can push this repo's workflows and publish to the channel the owner's app updates
# from, so it never shares a job with the code under test (claude-code-config#1125, SEC-201). The
# test job assembles and tests with no secret and no cache. The push job reassembles with git
# alone and dispatches one correlated qualification. A separate read-only job verifies its receipt
# using the trusted controller, then the tag job rechecks the run and refs before tagging. Jobs
# holding the bot credential execute no candidate code or JavaScript interpreter.
name: fork-assemble-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream release tag to assemble on (for example v1.4.222); with upstream_main_sha, the version floor and release name
        type: string
        required: true
      upstream_main_sha:
        description: Frozen stablyai/orca main commit to assemble on, lowercase 40-hex (empty assembles on the tag)
        type: string
        required: false
        default: ''
      dry_run:
        description: Assemble and test, but push nothing
        type: boolean
        default: false
      reviewer:
        description: Independent reviewer identity from the fleet receipt; required for publication
        type: string
        default: ''

permissions:
  actions: read
  contents: read

concurrency:
  group: fork-assemble-release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: stablyai/orca
  # The branch this run was started from: `mercurai` normally, a feature branch when dispatched for a test.
  FORK_BRANCH: ${{ github.ref_name }}
  MANIFEST: config/mercurai/patches.yaml
  MANIFEST_WORK: /tmp/manifest.yaml
  # The runner checkout has an upstream remote; gh prefers it when inferring the repo.
  GH_REPO: ${{ github.repository }}
  TAG: ${{ inputs.tag }}
  # Empty assembles on the tag. The script refuses anything but a full sha that official main holds.
  UPSTREAM_MAIN_SHA: ${{ inputs.upstream_main_sha }}
  REVIEWER: ${{ inputs.reviewer }}

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      release_branch: ${{ steps.assemble.outputs.release_branch }}
      release_tag: ${{ steps.assemble.outputs.release_tag }}
      tree: ${{ steps.assemble.outputs.tree }}
      upstream_main_sha: ${{ steps.assemble.outputs.upstream_main_sha }}
      series: ${{ steps.series.outputs.series }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assemble the release branch
        id: assemble
        run: |
          set -euo pipefail
          # Copied out first: the checkout moves to the tag, which has no config/mercurai/.
          cp config/mercurai/scripts/assemble-release.sh /tmp/assemble-release.sh
          bash /tmp/assemble-release.sh

      - name: Freeze the ordered patch series
        id: series
        run: |
          set -euo pipefail
          series=''
          while read -r patch; do
            [ -z "$patch" ] && continue
            pin=$(git rev-parse "origin/$patch^{commit}")
            series="${series:+$series,}$patch:$pin"
          done < /tmp/active
          echo "series=$series" >> "$GITHUB_OUTPUT"

      - name: Tests named by the series
        id: tests
        run: |
          set -euo pipefail
          mapfile -t tests < <(yq -r '.patches[] | select(.status == "upstream-open" or .status == "ours-only") | .tests[]?' "$MANIFEST_WORK" | sort -u)
          echo "count=${#tests[@]}" >> "$GITHUB_OUTPUT"
          [ "${#tests[@]}" -eq 0 ] && echo "no patch names tests; nothing to run" || printf '%s\n' "${tests[@]}"
      # The steps of the repo's install-node-dependencies, without its caches: a default-branch
      # cache could carry code no commit shows (claude-code-config#1125, SEC-102/SEC-201).
      - name: Setup pnpm
        if: ${{ steps.tests.outputs.count != '0' }}
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          install: false
      - name: Setup Node.js
        if: ${{ steps.tests.outputs.count != '0' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Install dependencies
        if: ${{ steps.tests.outputs.count != '0' }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          git diff --exit-code -- package.json pnpm-lock.yaml pnpm-workspace.yaml
          pnpm run --if-present build:packages
      - name: Run the series tests
        if: ${{ steps.tests.outputs.count != '0' }}
        run: |
          set -euo pipefail
          mapfile -t tests < <(yq -r '.patches[] | select(.status == "upstream-open" or .status == "ours-only") | .tests[]?' "$MANIFEST_WORK" | sort -u)
          pnpm exec vitest run --config config/vitest.config.ts --maxWorkers 2 "${tests[@]}"

      - name: Report the dry run
        if: ${{ !(github.ref == format('refs/heads/{0}', github.event.repository.default_branch || 'mercurai') && !inputs.dry_run) }}
        run: |
          echo "assembled tree ${{ steps.assemble.outputs.tree }}"
          echo "would tag ${{ steps.assemble.outputs.release_tag }} on ${{ steps.assemble.outputs.release_branch }}; nothing pushed"

  push:
    needs: test
    # Read from the dispatch alone: nothing the test job ran can open it.
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch || 'mercurai') && !inputs.dry_run }}
    runs-on: ubuntu-latest
    outputs:
      release_branch: ${{ steps.assemble.outputs.release_branch }}
      release_tag: ${{ steps.assemble.outputs.release_tag }}
      candidate_sha: ${{ steps.assemble.outputs.candidate_sha }}
      tree: ${{ steps.assemble.outputs.tree }}
      upstream_main_sha: ${{ steps.assemble.outputs.upstream_main_sha }}
      series: ${{ steps.series.outputs.series }}
      manifest_sha: ${{ steps.controller.outputs.manifest_sha }}
      policy_sha: ${{ steps.controller.outputs.policy_sha }}
      dispatch_id: ${{ steps.dispatch.outputs.dispatch_id }}
      workflow_id: ${{ steps.dispatch.outputs.workflow_id }}
      started_at: ${{ steps.dispatch.outputs.started_at }}
    steps:
      - name: Require the bot token
        env:
          HAS_TOKEN: ${{ secrets.FORK_BOT_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::FORK_BOT_TOKEN is not set; see config/mercurai/README.md (one-time setup)"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record the trusted controller inputs
        id: controller
        run: |
          set -euo pipefail
          if ! jq -e '.promotionEnabled == true' config/mercurai/release-policy.json >/dev/null; then
            echo "::error::release promotion is disabled pending the completion-audit gate corrections"
            exit 1
          fi
          echo "manifest_sha=$(git rev-parse HEAD:config/mercurai/patches.yaml)" >> "$GITHUB_OUTPUT"
          echo "policy_sha=$(sha256sum config/mercurai/release-policy.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      # Assembled again here, from git alone: the test job ran the code under test, so its result
      # is compared, never pushed. The same dispatched commit gives it the same manifest and inputs.
      - name: Assemble the release branch again
        id: assemble
        env:
          TESTED_BRANCH: ${{ needs.test.outputs.release_branch }}
          TESTED_TAG: ${{ needs.test.outputs.release_tag }}
          TESTED_TREE: ${{ needs.test.outputs.tree }}
        run: |
          set -euo pipefail
          cp config/mercurai/scripts/assemble-release.sh /tmp/assemble-release.sh
          bash /tmp/assemble-release.sh
          tree=$(git rev-parse 'HEAD^{tree}')
          branch=$(yq -r '.release_branch' "$MANIFEST_WORK")
          if [ "$tree" != "$TESTED_TREE" ] || [ "$branch" != "$TESTED_BRANCH" ]; then
            echo "::error::assembled $branch at tree $tree, but the tests ran on $TESTED_BRANCH at $TESTED_TREE; a patch branch moved during the run. Dispatch again."
            exit 1
          fi
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tested tree $tree; release tag $TESTED_TAG"

      - name: Freeze the ordered patch series again
        id: series
        run: |
          set -euo pipefail
          series=''
          while read -r patch; do
            [ -z "$patch" ] && continue
            pin=$(git rev-parse "origin/$patch^{commit}")
            series="${series:+$series,}$patch:$pin"
          done < /tmp/active
          echo "series=$series" >> "$GITHUB_OUTPUT"

      # The tree alone could match with other commits underneath: the base and the patch commits
      # this job assembled must be the ones the tests ran on.
      - name: Match the tested base and patch commits
        env:
          TESTED_MAIN_SHA: ${{ needs.test.outputs.upstream_main_sha }}
          TESTED_SERIES: ${{ needs.test.outputs.series }}
          ASSEMBLED_MAIN_SHA: ${{ steps.assemble.outputs.upstream_main_sha }}
          ASSEMBLED_SERIES: ${{ steps.series.outputs.series }}
        run: |
          set -euo pipefail
          if [ "$ASSEMBLED_MAIN_SHA" != "$TESTED_MAIN_SHA" ] || [ "$ASSEMBLED_SERIES" != "$TESTED_SERIES" ]; then
            echo "::error::assembled base ${ASSEMBLED_MAIN_SHA:-none} with patches ${ASSEMBLED_SERIES:-none}, but the tests ran on ${TESTED_MAIN_SHA:-none} with ${TESTED_SERIES:-none}. Dispatch again."
            exit 1
          fi

      - name: Push the assembled candidate branch
        env:
          GH_TOKEN: ${{ secrets.FORK_BOT_TOKEN }}
          RELEASE_BRANCH: ${{ steps.assemble.outputs.release_branch }}
          CANDIDATE_SHA: ${{ steps.assemble.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          # The release branch is assembled, never hand-edited, so replacing it is the contract.
          git push --force-with-lease origin "HEAD:refs/heads/$RELEASE_BRANCH"

      - name: Dispatch qualification for the assembled candidate
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.FORK_BOT_TOKEN }}
          CANDIDATE_SHA: ${{ steps.assemble.outputs.candidate_sha }}
          CANDIDATE_TREE: ${{ needs.test.outputs.tree }}
          RELEASE_TAG: ${{ steps.assemble.outputs.release_tag }}
          CONTROLLER_SHA: ${{ github.sha }}
          MANIFEST_SHA: ${{ steps.controller.outputs.manifest_sha }}
          POLICY_SHA: ${{ steps.controller.outputs.policy_sha }}
          SERIES: ${{ steps.series.outputs.series }}
          REVIEWER: ${{ env.REVIEWER }}
          FORK_BRANCH: ${{ env.FORK_BRANCH }}
        run: |
          set -euo pipefail
          [ -n "$REVIEWER" ] || { echo "::error::reviewer is required before qualification"; exit 1; }
          started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          dispatch_id="assembly-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${CANDIDATE_SHA}"
          workflow_id=$(gh api "repos/$GH_REPO/actions/workflows/fork-qualify-release.yml" --jq .id)
          [[ "$workflow_id" =~ ^[1-9][0-9]*$ ]] || { echo "::error::qualification workflow id is invalid"; exit 1; }
          gh workflow run fork-qualify-release.yml --ref "$FORK_BRANCH" \
            -f "dispatch_id=$dispatch_id" \
            -f "candidate_sha=$CANDIDATE_SHA" \
            -f "candidate_tree=$CANDIDATE_TREE" \
            -f "controller_sha=$CONTROLLER_SHA" \
            -f "manifest_sha=$MANIFEST_SHA" \
            -f "policy_sha=$POLICY_SHA" \
            -f "version=${RELEASE_TAG#v}" \
            -f "reviewed_sha=$CANDIDATE_SHA" \
            -f "reviewer=$REVIEWER" \
            -f "review_controller_sha=$CONTROLLER_SHA" \
            -f "series=$SERIES"
          {
            echo "dispatch_id=$dispatch_id"
            echo "workflow_id=$workflow_id"
            echo "started_at=$started_at"
          } >> "$GITHUB_OUTPUT"

  qualification:
    needs: push
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch || 'mercurai') && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      verified: ${{ steps.verify.outputs.verified }}
      run_id: ${{ steps.run.outputs.qualification_run_id }}
      attempt: ${{ steps.verify.outputs.attempt }}
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_SHA: ${{ needs.push.outputs.candidate_sha }}
      CANDIDATE_TREE: ${{ needs.push.outputs.tree }}
      CONTROLLER_SHA: ${{ github.sha }}
      MANIFEST_SHA: ${{ needs.push.outputs.manifest_sha }}
      POLICY_SHA: ${{ needs.push.outputs.policy_sha }}
      RELEASE_TAG: ${{ needs.push.outputs.release_tag }}
      SERIES: ${{ needs.push.outputs.series }}
      DISPATCH_ID: ${{ needs.push.outputs.dispatch_id }}
      WORKFLOW_ID: ${{ needs.push.outputs.workflow_id }}
      STARTED_AT: ${{ needs.push.outputs.started_at }}
    steps:
      - name: Checkout the trusted qualification verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          sparse-checkout: config/mercurai
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Freeze the external qualification expectation
        run: |
          set -euo pipefail
          export EXPECTATION="$RUNNER_TEMP/qualification-expected.json"
          echo "EXPECTATION=$EXPECTATION" >> "$GITHUB_ENV"
          [ "$(git rev-parse HEAD)" = "$CONTROLLER_SHA" ] || { echo "::error::verifier controller changed"; exit 1; }
          [ "$(git rev-parse HEAD:config/mercurai/patches.yaml)" = "$MANIFEST_SHA" ] || { echo "::error::verifier manifest changed"; exit 1; }
          [ "$(sha256sum config/mercurai/release-policy.json | awk '{print $1}')" = "$POLICY_SHA" ] || { echo "::error::verifier policy changed"; exit 1; }
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs'
          const env = process.env
          const expected = {
            repository: env.GITHUB_REPOSITORY,
            workflowId: Number(env.WORKFLOW_ID),
            workflowPath: '.github/workflows/fork-qualify-release.yml',
            branch: env.FORK_BRANCH,
            dispatchId: env.DISPATCH_ID,
            startedAt: env.STARTED_AT,
            candidate: {
              commit: env.CANDIDATE_SHA,
              tree: env.CANDIDATE_TREE,
              controllerSha: env.CONTROLLER_SHA,
              manifestSha: env.MANIFEST_SHA,
              policySha: env.POLICY_SHA,
              version: env.RELEASE_TAG.slice(1),
              series: env.SERIES ? env.SERIES.split(',').filter(Boolean) : []
            }
          }
          writeFileSync(env.EXPECTATION, `${JSON.stringify(expected)}\n`)
          NODE

      - name: Select and watch the exact qualification run
        id: run
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 30); do
            gh api --method GET --paginate --slurp "repos/$GH_REPO/actions/workflows/$WORKFLOW_ID/runs" \
              -f branch="$FORK_BRANCH" -f event=workflow_dispatch -f head_sha="$CONTROLLER_SHA" \
              -f created=">=$STARTED_AT" -F per_page=100 > "$RUNNER_TEMP/qualification-runs.json"
            run_id=$(node config/mercurai/scripts/qualification-run.mjs select "$RUNNER_TEMP/qualification-runs.json" "$EXPECTATION")
            if [ -n "$run_id" ]; then break; fi
            sleep 10
          done
          [ -n "$run_id" ] || { echo "::error::correlated qualification run was not created"; exit 1; }
          gh run watch "$run_id" --exit-status
          echo "qualification_run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Verify the exact qualification receipt
        id: verify
        env:
          QUALIFICATION_RUN_ID: ${{ steps.run.outputs.qualification_run_id }}
        run: |
          set -euo pipefail
          gh run download "$QUALIFICATION_RUN_ID" --name promotion-receipt --dir "$RUNNER_TEMP/promotion-receipt"
          gh api "repos/$GH_REPO/actions/runs/$QUALIFICATION_RUN_ID" > "$RUNNER_TEMP/qualification-run.json"
          node config/mercurai/scripts/qualification-run.mjs verify \
            "$RUNNER_TEMP/promotion-receipt/promotion-receipt.json" config/mercurai/release-policy.json \
            "$EXPECTATION" "$RUNNER_TEMP/qualification-run.json" "$QUALIFICATION_RUN_ID"
          echo 'verified=true' >> "$GITHUB_OUTPUT"
          echo "attempt=$(jq -r '.run_attempt' "$RUNNER_TEMP/qualification-run.json")" >> "$GITHUB_OUTPUT"

  tag:
    needs: [push, qualification]
    if: ${{ needs.qualification.outputs.verified == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch || 'mercurai') && !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Tag the qualified candidate
        env:
          GH_TOKEN: ${{ secrets.FORK_BOT_TOKEN }}
          RELEASE_BRANCH: ${{ needs.push.outputs.release_branch }}
          RELEASE_TAG: ${{ needs.push.outputs.release_tag }}
          CANDIDATE_SHA: ${{ needs.push.outputs.candidate_sha }}
          CANDIDATE_TREE: ${{ needs.push.outputs.tree }}
          MAIN_SHA: ${{ needs.push.outputs.upstream_main_sha }}
          SERIES: ${{ needs.push.outputs.series }}
          QUALIFICATION_RUN_ID: ${{ needs.qualification.outputs.run_id }}
          QUALIFICATION_ATTEMPT: ${{ needs.qualification.outputs.attempt }}
          DISPATCH_ID: ${{ needs.push.outputs.dispatch_id }}
          WORKFLOW_ID: ${{ needs.push.outputs.workflow_id }}
        run: |
          set -euo pipefail
          remote=$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | awk '{print $1}')
          [ "$remote" = "$CANDIDATE_SHA" ] || { echo "::error::candidate branch moved during qualification"; exit 1; }
          controller=$(git ls-remote origin "refs/heads/$FORK_BRANCH" | awk '{print $1}')
          [ "$controller" = "$GITHUB_SHA" ] || { echo "::error::controller branch moved during qualification"; exit 1; }
          [ "$(git rev-parse "$CANDIDATE_SHA^{tree}")" = "$CANDIDATE_TREE" ] || { echo "::error::candidate tree changed"; exit 1; }
          gh api "repos/$GH_REPO/actions/runs/$QUALIFICATION_RUN_ID" | jq -e \
            --argjson run "$QUALIFICATION_RUN_ID" --argjson attempt "$QUALIFICATION_ATTEMPT" \
            --argjson workflow "$WORKFLOW_ID" --arg controller "$GITHUB_SHA" \
            --arg repository "$GH_REPO" --arg branch "$FORK_BRANCH" --arg title "qualify $DISPATCH_ID" \
            '.id == $run and .run_attempt == $attempt and .workflow_id == $workflow and
             .head_sha == $controller and .repository.full_name == $repository and .head_branch == $branch and
             .event == "workflow_dispatch" and .display_title == $title and
             .status == "completed" and .conclusion == "success"' >/dev/null
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git config user.name mercurai-fork-bot
          git config user.email fork-bot@users.noreply.github.com
          git tag -a "$RELEASE_TAG" "$CANDIDATE_SHA" -m "mercurai release on $TAG${MAIN_SHA:+ at upstream main $MAIN_SHA}${SERIES:+: pinned $SERIES}"
          git push origin "refs/tags/$RELEASE_TAG"
          echo "tagged $RELEASE_TAG on $RELEASE_BRANCH"

      - name: Hand the new tag to fork-release-win-build
        env:
          GH_TOKEN: ${{ secrets.FORK_BOT_TOKEN }}
          RELEASE_TAG: ${{ needs.push.outputs.release_tag }}
          QUALIFICATION_RUN_ID: ${{ needs.qualification.outputs.run_id }}
        run: |
          gh workflow run fork-release-win-build.yml --ref "$FORK_BRANCH" -f "tag=$RELEASE_TAG" -f "qualification_run_id=$QUALIFICATION_RUN_ID" || {
            echo "::error::$RELEASE_TAG is tagged but the build was not dispatched; run: gh workflow run fork-release-win-build.yml -R mercurai/orca --ref $FORK_BRANCH -f tag=$RELEASE_TAG (the token needs Actions write)"
            exit 1
          }
