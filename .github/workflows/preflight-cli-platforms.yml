name: Preflight CLI platforms

on:
  pull_request:
    paths:
      - 'src/main/ipc/preflight*'
      - 'src/main/ipc/agent-detection-shell-path.ts'
      - 'src/main/ipc/command-path-resolver*'
      - 'src/main/preflight/**'
      - 'src/main/startup/*shell*'
      - 'src/packages/process-host/**'
      - '.github/actions/install-node-dependencies/**'
      - '.github/workflows/preflight-cli-platforms.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preflight-cli-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: Preflight CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        id: deps
        with:
          native-runtime: node
          cache-electron-package: 'true'
      - name: Check native CLI execution and shell PATH discovery
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts --maxWorkers=2
          src/main/ipc/preflight-command-exec.test.ts
          src/main/ipc/preflight-host-cli-status.test.ts
          src/main/ipc/preflight-runnable-local-cli.test.ts
          src/main/ipc/preflight-agent-detection.test.ts
          src/main/ipc/preflight-agent-refresh.test.ts
          src/main/ipc/preflight-wsl-agent-detection.test.ts
          src/main/ipc/preflight-windows-path-refresh.repro.test.ts
          src/main/startup/hydrate-shell-path.test.ts
          src/main/startup/hydrate-shell-path.windows.test.ts
          src/main/startup/login-shell-environment.test.ts
          src/main/runtime/rpc/methods/preflight.test.ts
          src/packages/process-host/src/process-tree-termination.test.ts
          src/packages/process-host/src/run-process.test.ts
          src/packages/process-host/src/run-process-termination-failure.test.ts
          src/packages/process-host/src/windows-codex-native-spawn.test.ts
          src/packages/process-host/src/windows-codex-native-resolution.test.ts
          src/cli/agent-codex-native.test.ts
          src/cli/agent-codex-native-protocol.test.ts
          src/cli/runtime-client-deferral.test.ts
          src/main/text-generation/source-control-agent-launch.test.ts
          src/main/codex-accounts/codex-windows-interactive-login.test.ts
          src/main/rate-limits/codex-fetcher-worker-thread.test.ts
          src/main/codex/codex-state-db-backfill-recovery-supervision.test.ts
          src/shared/agent-process-recognition.test.ts
          src/main/pty/codex-shell-native-launch.test.ts
          src/main/pty/codex-shell-no-daemon.test.ts
          config/scripts/windows-pe-machine.test.mjs
          config/scripts/windows-pe-machine-package.test.mjs
          config/scripts/packaged-process-host.test.mjs
          config/scripts/ci-native-cache.test.mjs
          config/scripts/orcad-windows-prebuild-cache.test.mjs
          config/scripts/pr-code-change-scope.test.mjs
          config/scripts/pr-code-change-scope-process-host.test.mjs
      - name: Setup the process-host minimum runtime
        id: node18
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        uses: actions/setup-node@v6
        with:
          node-version: '18'
          package-manager-cache: false
      - name: Verify staged process-host exports on Node 18
        if: ${{ !cancelled() && steps.node18.outcome == 'success' }}
        run: node config/scripts/smoke-process-host-node18.mjs
