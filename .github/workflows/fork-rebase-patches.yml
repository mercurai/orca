# mercurai fork: keep every active patch branch in .mercurai/patches.yaml rebased.
# With a `tag` input (dispatched by fork-sync-upstream for each new release tag): rebase each
# branch from its recorded base onto the tag, run the patch's tests, push with
# --force-with-lease, record the new base in the manifest and mark patches upstream already
# carries. On the daily schedule, with no tag: a dry rebase onto upstream/main that only reports,
# so a conflict shows days before the tag that would carry it. Lives in the fork only.
name: fork-rebase-patches

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream release tag to rebase the series onto (empty = dry run against upstream/main)
        type: string
        default: ''
  schedule:
    - cron: '30 5 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: fork-rebase-patches
  cancel-in-progress: false

env:
  UPSTREAM_REPO: stablyai/orca
  # The branch this run was started from: `mercurai` on the schedule, a feature branch when dispatched for a test.
  FORK_BRANCH: ${{ github.ref_name }}
  MANIFEST: .mercurai/patches.yaml
  MANIFEST_WORK: /tmp/manifest.yaml
  CONFLICT_LABEL: patch-conflict

jobs:
  rebase:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.FORK_BOT_TOKEN || github.token }}

      - name: Fetch upstream and the patch branches
        run: |
          set -euo pipefail
          git config user.name 'mercurai-fork-bot'
          git config user.email 'fork-bot@users.noreply.github.com'
          git config rerere.enabled true
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream main
          git fetch upstream --tags
          git fetch origin '+refs/heads/patch/*:refs/remotes/origin/patch/*'
          if [ -n "$TARGET" ]; then git rev-parse --verify "refs/tags/$TARGET" >/dev/null; fi

      - name: Active patches
        id: patches
        run: |
          set -euo pipefail
          # Patch branches and tags do not carry .mercurai/, so every later read and edit uses this copy.
          cp "$MANIFEST" "$MANIFEST_WORK"
          yq -r '.patches[] | select(.status == "upstream-open" or .status == "ours-only") | .branch' "$MANIFEST_WORK" > /tmp/active
          echo "count=$(wc -l < /tmp/active)" >> "$GITHUB_OUTPUT"
          echo "active patches: $(tr '\n' ' ' < /tmp/active)"

      - uses: ./.github/actions/install-node-dependencies
        if: ${{ steps.patches.outputs.count != '0' }}

      - name: Rebase, test, push
        if: ${{ steps.patches.outputs.count != '0' }}
        id: rebase
        env:
          GH_TOKEN: ${{ secrets.FORK_BOT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          base="${TARGET:-upstream/main}"
          mode=$([ -n "$TARGET" ] && echo real || echo dry)
          failed=0
          while read -r branch; do
            [ -z "$branch" ] && continue
            old=$(yq -r ".patches[] | select(.branch == \"$branch\") | .base // \"\"" "$MANIFEST_WORK")
            old=${old:-$(yq -r '.base' "$MANIFEST_WORK")}
            git checkout -q -B "$branch" "origin/$branch"
            before=$(git rev-parse HEAD)
            if git rebase --onto "$base" "$old"; then
              mapfile -t tests < <(yq -r ".patches[] | select(.branch == \"$branch\") | .tests[]?" "$MANIFEST_WORK")
              if [ "${#tests[@]}" -gt 0 ] && ! pnpm exec vitest run --config config/vitest.config.ts "${tests[@]}"; then
                echo "::error::$branch: tests fail after rebase onto $base"
                failed=1
                git checkout -q "$FORK_BRANCH"
                continue
              fi
              if [ "$mode" = real ]; then
                git push --force-with-lease="refs/heads/$branch:$before" origin "$branch"
                git checkout -q "$FORK_BRANCH"
                yq -i "(.patches[] | select(.branch == \"$branch\") | .base) = \"$TARGET\"" "$MANIFEST_WORK"
              else
                echo "$branch rebases cleanly onto $base (dry run)"
                git checkout -q "$FORK_BRANCH"
              fi
            else
              git diff --name-only --diff-filter=U | head -50 > /tmp/conflicts
              git rebase --abort
              git checkout -q "$FORK_BRANCH"
              failed=1
              title="patch-conflict: $branch does not rebase onto $base"
              body=$(printf 'Rebasing `%s` from `%s` onto `%s` (%s run) conflicts in:\n\n```\n%s\n```\n\nResolve in a lane, push the branch, and rerun fork-rebase-patches with tag=%s.\n' \
                "$branch" "$old" "$base" "$mode" "$(cat /tmp/conflicts)" "${TARGET:-<next tag>}")
              existing=$(gh issue list --label "$CONFLICT_LABEL" --state open --search "in:title \"$branch\"" --json number --jq '.[0].number')
              if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else
                gh label create "$CONFLICT_LABEL" --color d93f0b --description 'a patch branch no longer rebases' 2>/dev/null || true
                gh issue create --label "$CONFLICT_LABEL" --title "$title" --body "$body"
              fi
            fi
          done < /tmp/active
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Mark patches upstream already carries
        if: ${{ inputs.tag != '' && steps.patches.outputs.count != '0' }}
        run: |
          set -euo pipefail
          while read -r branch; do
            [ -z "$branch" ] && continue
            # `git cherry` prints `+` for commits upstream lacks; none left means upstream merged the patch.
            if ! git cherry upstream/main "origin/$branch" | grep -q '^+'; then
              yq -i "(.patches[] | select(.branch == \"$branch\") | .status) = \"merged-upstream\"" "$MANIFEST_WORK"
              echo "$branch is fully contained in upstream/main -> merged-upstream"
            fi
          done < /tmp/active

      - name: Record the new base in the manifest
        if: ${{ inputs.tag != '' }}
        run: |
          set -euo pipefail
          yq -i ".base = \"$TARGET\"" "$MANIFEST_WORK"
          git checkout -q "$FORK_BRANCH"
          cp "$MANIFEST_WORK" "$MANIFEST"
          if ! git diff --quiet -- "$MANIFEST"; then
            git add "$MANIFEST"
            git commit -m "chore(fork): patch series rebased onto $TARGET"
            git push origin "$FORK_BRANCH"
          fi

      - name: Fail the run when any patch failed
        if: ${{ steps.rebase.outputs.failed == '1' }}
        run: exit 1
