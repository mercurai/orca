# mercurai fork: keep every active patch branch in config/mercurai/patches.yaml rebased.
# With a `tag` input (dispatched by fork-sync-upstream for the newest release tag): rebase each
# active branch from its recorded base onto the tag in local refs and run its tests. Only when
# every patch rebased, push all patch branches (each leased on its pre-rebase sha) and the
# manifest base in one atomic push, so a conflict leaves the whole series on its old base.
# On the daily schedule, with no tag, it dry-rebases onto upstream/main and only reports, so a
# conflict shows days before the tag that would carry it.
# Dispatched from a non-default branch it only reports. Lives in the fork only.
#
# FORK_BOT_TOKEN can push this repo's workflows and publish to the channel the owner's app updates
# from, so it never shares a job with the code under test (claude-code-config#1125, SEC-201). The
# test job rebases and tests with no secret and no cache; it is the whole of a dry run. The push
# job, for a tag on the default branch only, runs no repository code: it rebases again with git
# alone, pushes only if every tree is the one tested, and hands the token to its write steps only.
name: fork-rebase-patches

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream release tag to rebase the series onto (empty = dry run against upstream/main)
        type: string
        default: ''
      tag_sha:
        description: Commit the tag pointed at when fork-sync-upstream saw it; the run fails if the tag moved since
        type: string
        default: ''
      dry_run:
        description: With a tag, rebase and test against the pinned tag, print the refs, leases and manifest change, and push nothing
        type: boolean
        default: false
      overrides:
        description: 'Hand-ported patch heads to use instead of rebasing: patch/<name>=<40-hex sha> pairs, comma or space separated. Each must contain the base and be fetchable from origin; the push job pushes them in the same atomic push'
        type: string
        default: ''
  schedule:
    - cron: '30 5 * * *'

permissions:
  contents: read

concurrency:
  group: fork-rebase-patches
  cancel-in-progress: false

env:
  UPSTREAM_REPO: stablyai/orca
  # gh infers the repo from the remote named upstream when one exists, so a bare `gh workflow run`
  # or `gh issue create` on the runner went to stablyai/orca (HTTP 404 on 2026-10-08). Pin it to this fork.
  GH_REPO: ${{ github.repository }}
  # The branch this run was started from: `mercurai` on the schedule, a feature branch when dispatched for a test.
  FORK_BRANCH: ${{ github.ref_name }}
  MANIFEST: config/mercurai/patches.yaml
  MANIFEST_WORK: /tmp/manifest.yaml
  CONFLICT_LABEL: patch-conflict
  TARGET: ${{ inputs.tag }}
  TAG_SHA: ${{ inputs.tag_sha }}
  OVERRIDES: ${{ inputs.overrides }}

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      failed: ${{ steps.test.outputs.failed }}
      trees: ${{ steps.test.outputs.trees }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream, the tag and the patch branches
        id: fetch
        run: bash config/mercurai/scripts/fetch-rebase-inputs.sh

      - name: Active patches
        id: patches
        run: |
          set -euo pipefail
          # Patch branches and tags do not carry config/mercurai/, so every later read uses these copies.
          cp "$MANIFEST" "$MANIFEST_WORK"
          cp -r config/mercurai/scripts /tmp/fork-scripts
          yq -r '.patches[] | select(.status == "upstream-open" or .status == "ours-only") | .branch' "$MANIFEST_WORK" > /tmp/active
          echo "count=$(wc -l < /tmp/active)" >> "$GITHUB_OUTPUT"
          echo "active patches: $(tr '\n' ' ' < /tmp/active)"

      - name: Rebase in local refs
        if: ${{ steps.patches.outputs.count != '0' }}
        env:
          BASE: ${{ steps.fetch.outputs.base }}
        run: |
          set -euo pipefail
          bash /tmp/fork-scripts/rebase-series.sh
          while read -r branch old; do
            echo "::warning::$branch does not rebase from $old onto $BASE; conflicts in: $(tr '\n' ' ' < "/tmp/conflicts/${branch//\//__}")"
          done < /tmp/conflicted

      - name: Check out the base so the installed dependencies match the code under test
        if: ${{ steps.patches.outputs.count != '0' }}
        run: git checkout -q --detach "${{ steps.fetch.outputs.base }}"
      # The steps of the repo's install-node-dependencies, without its caches: a default-branch
      # cache could carry code no commit shows (claude-code-config#1125, SEC-102/SEC-201).
      - name: Setup pnpm
        if: ${{ steps.patches.outputs.count != '0' }}
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          install: false
      - name: Setup Node.js
        if: ${{ steps.patches.outputs.count != '0' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Install dependencies
        if: ${{ steps.patches.outputs.count != '0' }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          git diff --exit-code -- package.json pnpm-lock.yaml pnpm-workspace.yaml
          pnpm run --if-present build:packages

      - name: Test each rebased patch
        if: ${{ steps.patches.outputs.count != '0' }}
        id: test
        env:
          BASE: ${{ steps.fetch.outputs.base }}
        run: |
          set -euo pipefail
          failed=0
          [ -s /tmp/conflicted ] && failed=1
          : > /tmp/trees
          while read -r branch _before _after; do
            if grep -qxF "$branch" /tmp/merged; then
              echo "$branch merged" >> /tmp/trees
              continue
            fi
            git checkout -q "$branch"
            mapfile -t tests < <(yq -r ".patches[] | select(.branch == \"$branch\") | .tests[]?" "$MANIFEST_WORK")
            if [ "${#tests[@]}" -gt 0 ] && ! pnpm exec vitest run --config config/vitest.config.ts "${tests[@]}"; then
              echo "::error::$branch: tests fail after rebase onto $BASE"
              failed=1
              continue
            fi
            echo "$branch rebases cleanly onto $BASE ($(git rev-list --count "$BASE..HEAD") commits)"
            echo "$branch $(git rev-parse 'HEAD^{tree}')" >> /tmp/trees
          done < /tmp/rebased
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          { echo 'trees<<ORCA_TESTED_TREES'; cat /tmp/trees; echo 'ORCA_TESTED_TREES'; } >> "$GITHUB_OUTPUT"

      # What the push job would push, from the same files it reads. Nothing here has a token.
      - name: Report the dry run
        if: ${{ inputs.dry_run && inputs.tag != '' && steps.patches.outputs.count != '0' }}
        run: |
          set -euo pipefail
          while read -r branch before after; do
            echo "would push $after to refs/heads/$branch, leased on $before"
          done < /tmp/rebased
          cp "$MANIFEST_WORK" /tmp/manifest-before.yaml
          bash /tmp/fork-scripts/record-series.sh
          echo "manifest change the push job would commit on $FORK_BRANCH:"
          diff -u /tmp/manifest-before.yaml "$MANIFEST_WORK" || true
          echo "dry run; nothing pushed"

      # A dry run (the schedule, no tag, dry_run, or a feature branch) ends here and reports through this job.
      - name: Fail a dry run when any patch failed
        if: ${{ steps.test.outputs.failed == '1' && !(inputs.tag != '' && !inputs.dry_run && github.ref == format('refs/heads/{0}', github.event.repository.default_branch || 'mercurai')) }}
        run: exit 1

  push:
    needs: test
    # Read from the dispatch alone: nothing the test job ran can open it. Runs after a failed test
    # job too, to file conflicts and publish the CI base the resolving lane needs.
    if: ${{ !cancelled() && inputs.tag != '' && !inputs.dry_run && github.ref == format('refs/heads/{0}', github.event.repository.default_branch || 'mercurai') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the bot token
        env:
          HAS_TOKEN: ${{ secrets.FORK_BOT_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::FORK_BOT_TOKEN is not set; see config/mercurai/README.md (one-time setup)"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream, the tag and the patch branches
        id: fetch
        run: bash config/mercurai/scripts/fetch-rebase-inputs.sh

      - name: Active patches
        id: patches
        run: |
          set -euo pipefail
          cp "$MANIFEST" "$MANIFEST_WORK"
          cp "$MANIFEST" /tmp/manifest-original.yaml
          cp -r config/mercurai/scripts /tmp/fork-scripts
          yq -r '.patches[] | select(.status == "upstream-open" or .status == "ours-only") | .branch' "$MANIFEST_WORK" > /tmp/active
          echo "count=$(wc -l < /tmp/active)" >> "$GITHUB_OUTPUT"

      # Rebased again here, from git alone: the test job ran the code under test, so its result is
      # compared, never pushed. Commit shas differ between the two runs; the trees must not.
      - name: Rebase again and match the tested trees
        if: ${{ steps.patches.outputs.count != '0' }}
        id: rebase
        env:
          BASE: ${{ steps.fetch.outputs.base }}
          TEST_RESULT: ${{ needs.test.result }}
          TEST_FAILED: ${{ needs.test.outputs.failed }}
          TESTED_TREES: ${{ needs.test.outputs.trees }}
        run: |
          set -euo pipefail
          bash /tmp/fork-scripts/rebase-series.sh
          git checkout -q "$FORK_BRANCH"
          failed=0
          if [ "$TEST_RESULT" != success ] || [ "$TEST_FAILED" != 0 ] || [ -s /tmp/conflicted ]; then failed=1; fi
          while read -r branch _before after; do
            # A patch counts as merged upstream only if the tested run saw it that way too.
            tree=merged
            grep -qxF "$branch" /tmp/merged || tree=$(git rev-parse "$after^{tree}")
            if ! grep -qxF "$branch $tree" <<<"$TESTED_TREES"; then
              echo "::error::$branch rebased to tree $tree here, which is not the tree its tests ran on"
              failed=1
            fi
          done < /tmp/rebased
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: File each conflict as an issue
        if: ${{ steps.patches.outputs.count != '0' }}
        env:
          GH_TOKEN: ${{ secrets.FORK_BOT_TOKEN }}
          BASE: ${{ steps.fetch.outputs.base }}
        run: |
          set -euo pipefail
          while read -r branch old; do
            title="patch-conflict: $branch does not rebase onto $BASE"
            body=$(printf 'Rebasing `%s` from `%s` onto `%s` (real run) conflicts in:\n\n```\n%s\n```\n\nResolve in a lane (a patch upstream squash-merged shows up here too: mark it merged-upstream), push the branch, and rerun fork-rebase-patches with tag=%s.\n' \
              "$branch" "$old" "$BASE" "$(cat "/tmp/conflicts/${branch//\//__}")" "$TARGET")
            existing=$(gh issue list --label "$CONFLICT_LABEL" --state open --search "in:title \"$branch\"" --json number --jq '.[0].number')
            if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else
              gh label create "$CONFLICT_LABEL" --color d93f0b --description 'a patch branch no longer rebases' 2>/dev/null || true
              gh issue create --label "$CONFLICT_LABEL" --title "$title" --body "$body"
            fi
          done < /tmp/conflicted

      - name: Record the base and the merged patches, then push the series atomically
        # Only when every patch rebased and tested: a partly rebased series must not look assembled.
        if: ${{ steps.patches.outputs.count != '0' && steps.rebase.outputs.failed == '0' }}
        env:
          GH_TOKEN: ${{ secrets.FORK_BOT_TOKEN }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          bash /tmp/fork-scripts/record-series.sh
          cp "$MANIFEST_WORK" "$MANIFEST"
          manifest_commit=''
          if git diff --quiet -- "$MANIFEST"; then echo "manifest unchanged"; else
            git add "$MANIFEST"
            git commit -m "chore(fork): patch series rebased onto $TARGET"
            manifest_commit=$(git rev-parse HEAD)
          fi
          # Every patch branch and the manifest move in one atomic push, or none of them does.
          bash /tmp/fork-scripts/push-rebased-series.sh /tmp/rebased "$FORK_BRANCH" "$manifest_commit"

      # Patch CI: a draft PR from a patch branch against ci-base/<tag> runs upstream's pr.yml on the tag plus
      # the patch, which is what gets assembled. A merge with the default branch is not that and conflicts.
      # After the series push, and also when a patch conflicted: the lane resolving it needs the base.
      - name: Publish the CI base branch for the tag
        if: ${{ !cancelled() && steps.patches.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.FORK_BOT_TOKEN }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          # Carry the fork-CI commits of the old ci-base instead of publishing the bare tag (#1107).
          old_base=$(yq -r '.base' /tmp/manifest-original.yaml)
          if ! bash /tmp/fork-scripts/carry-ci-base.sh "$old_base" "$TARGET" "${{ steps.fetch.outputs.base }}"; then
            title="ci-base: ci-base/$TARGET could not carry the fork-CI commits of ci-base/$old_base"
            body="fork-rebase-patches run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID could not publish ci-base/$TARGET with the fork-CI commits of ci-base/$old_base. Carry them by hand (see the run log) before opening patch CI PRs against it."
            existing=$(gh issue list --label "$CONFLICT_LABEL" --state open --search "in:title \"ci-base/$TARGET\"" --json number --jq '.[0].number')
            if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else
              gh label create "$CONFLICT_LABEL" --color d93f0b --description 'a patch branch no longer rebases' 2>/dev/null || true
              gh issue create --label "$CONFLICT_LABEL" --title "$title" --body "$body"
            fi
            exit 1
          fi

      - name: Fail the run when any patch failed
        if: ${{ steps.rebase.outputs.failed == '1' }}
        run: exit 1
