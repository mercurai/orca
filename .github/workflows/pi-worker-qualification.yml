name: Pi worker qualification

on:
  push:
    branches: [feat/pi-supervised-workers-20261026]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-worker-qualification-${{ github.ref }}
  cancel-in-progress: true

env:
  ORCA_BACKGROUND_LAUNCH: '1'

jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: config/.bun-version
      - name: Pi composed implementation regressions
        id: contracts
        continue-on-error: true
        shell: bash
        run: >-
          pnpm test
          src/shared/agent-session-option-catalog.test.ts
          src/main/runtime/rpc/methods/orchestration/worker/worker-launch-preferences.test.ts
          src/main/pi/rpc-options.test.ts src/main/pi/rpc-prompt-delivery.test.ts
          src/main/pi/rpc-launch.test.ts
          src/main/pi/rpc-worker-package.test.ts
          src/main/pi/rpc-session-adapter.test.ts
          src/main/pi/rpc-configured-default.test.ts
          src/main/pi/rpc-turn-races.test.ts
          src/main/pi/rpc-capture-replay.test.ts
          src/shared/agent-session-option-catalog-removers.test.ts
          src/main/runtime/orchestration/db/pi-worker-admission.test.ts
          src/main/runtime/rpc/methods/orchestration/worker/pi-worker-admission-rpc.test.ts
          src/cli/handlers/pi-worker-admission-cli.test.ts
          src/main/runtime/orchestration/pi-worker-package.test.ts
          src/main/runtime/orchestration/pi-worker-delivery-contract.test.ts
          src/main/runtime/rpc/orchestration-session-caller.test.ts
          src/shared/orchestration-rpc-contract.test.ts
          src/main/runtime/rpc/methods/orchestration/worker/worker-start-launch-executor-parity.test.ts
          src/main/pi/worker-report-bridge.test.ts
          src/main/runtime/orchestration/preamble-pi.test.ts
          src/main/runtime/rpc/methods/orchestration-structured-worker-session.test.ts
          src/main/runtime/rpc/methods/orchestration/worker/worker-start-outcome-classification.test.ts
          src/main/runtime/rpc/methods/structured-worker-tab-retirement.test.ts
          --maxWorkers=2
      - name: Typecheck Node and CLI integration
        id: types
        continue-on-error: true
        shell: bash
        run: pnpm tc:node && pnpm tc:cli
      - name: Build CLI
        id: build
        continue-on-error: true
        shell: bash
        run: pnpm build:cli
      - name: Require every composed qualification gate
        if: always() && !cancelled()
        shell: bash
        env:
          CONTRACTS: ${{ steps.contracts.outcome }}
          TYPES: ${{ steps.types.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: test "$CONTRACTS" = success && test "$TYPES" = success && test "$BUILD" = success
