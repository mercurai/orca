name: Pi worker admission

on:
  push:
    branches: [feat/pi-worker-admission-20261026]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-worker-admission-${{ github.ref }}
  cancel-in-progress: true

env:
  ORCA_BACKGROUND_LAUNCH: '1'

jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: config/.bun-version
      - name: Pi durable admission regressions
        shell: bash
        run: pnpm test src/main/runtime/orchestration/db/pi-worker-admission.test.ts --maxWorkers=2
