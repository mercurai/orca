# Throwaway: runs the fork scripts' tests on the ci-only branch. Never merged.
name: ci-only-fork-scripts-1123
on:
  push:
    branches: ['ci-only/rebase-dry-run-1123']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Series scripts harness
        run: bash config/mercurai/scripts/test-fork-series-scripts.sh
      - name: Node pinning tests
        run: node --test "config/mercurai/scripts/*.test.mjs"
      - name: Lint the fork scripts
        run: npx --yes oxlint@1.86.0 config/mercurai
