# mercurai fork: mirror upstream into `main` (fast-forward only), mirror tags, merge `main`
# forward into `mercurai` (the default branch that carries the fork's own files), and hand every
# new release tag to fork-rebase-patches. Lives in the fork only; never sent upstream.
name: fork-sync-upstream

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      mirror_branches:
        description: Also mirror every upstream branch under upstream/* (tags are what the patch series rebases onto, so this is off by default)
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: fork-sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: stablyai/orca
  # The branch this run was started from: `mercurai` on the schedule, a feature branch when dispatched for a test.
  FORK_BRANCH: ${{ github.ref_name }}
  SYNC_ISSUE_LABEL: fork-sync

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.FORK_BOT_TOKEN || github.token }}

      - name: Identify the bot
        run: |
          git config user.name 'mercurai-fork-bot'
          git config user.email 'fork-bot@users.noreply.github.com'

      - name: Fetch upstream main and tags
        id: fetch
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git ls-remote --tags origin | awk '{print $2}' | grep -v '\^{}$' | sort > /tmp/tags-before
          git fetch --no-tags upstream main
          git fetch upstream --tags
          git tag -l | sed 's#^#refs/tags/#' | sort > /tmp/tags-after
          comm -13 /tmp/tags-before /tmp/tags-after | sed 's#^refs/tags/##' > /tmp/tags-new
          echo "new tags: $(tr '\n' ' ' < /tmp/tags-new)"
          echo "upstream_sha=$(git rev-parse upstream/main)" >> "$GITHUB_OUTPUT"

      - name: Mirror main (fast-forward only)
        # A non-fast-forward push fails here on purpose: `main` must never carry fork commits.
        run: git push origin refs/remotes/upstream/main:refs/heads/main

      - name: Mirror tags
        # A tag that upstream moved is rejected rather than forced; the job fails and a human decides.
        run: git push origin --tags

      - name: Mirror upstream branches under upstream/*
        if: ${{ inputs.mirror_branches == true }}
        run: |
          git fetch --no-tags upstream '+refs/heads/*:refs/remotes/upstream/*'
          git push origin 'refs/remotes/upstream/*:refs/heads/upstream/*'

      - name: Merge main forward into the fork branch
        id: merge
        run: |
          set -euo pipefail
          git checkout "$FORK_BRANCH"
          if git merge --no-edit upstream/main; then
            git push origin "$FORK_BRANCH"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U | head -50 > /tmp/conflicts
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report a merge conflict as an issue
        if: ${{ steps.merge.outputs.conflict == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.FORK_BOT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          title="fork-sync: ${FORK_BRANCH} does not merge with upstream main ${{ steps.fetch.outputs.upstream_sha }}"
          body=$(printf 'Merging upstream/main (%s) into `%s` conflicts in:\n\n```\n%s\n```\n\nResolve on a branch from `%s`, open a PR, and the next hourly run continues.\n' \
            "${{ steps.fetch.outputs.upstream_sha }}" "$FORK_BRANCH" "$(cat /tmp/conflicts)" "$FORK_BRANCH")
          existing=$(gh issue list --label "$SYNC_ISSUE_LABEL" --state open --search "in:title fork-sync:" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create "$SYNC_ISSUE_LABEL" --color d93f0b --description 'fork sync needs a human' 2>/dev/null || true
            gh issue create --label "$SYNC_ISSUE_LABEL" --title "$title" --body "$body"
          fi
          exit 1

      - name: Hand new release tags to fork-rebase-patches
        env:
          GH_TOKEN: ${{ secrets.FORK_BOT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$' /tmp/tags-new | while read -r tag; do
            echo "dispatching rebase onto $tag"
            gh workflow run fork-rebase-patches.yml --ref "$FORK_BRANCH" -f "tag=$tag"
          done
